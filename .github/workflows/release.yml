name: Release

# Release candidates of the landing (Gitflow "model C + tag at the end", docs/DEPLOY.md). A push to
# release/x.y.z or hotfix/x.y.z:
#
#   candidate    builds dist/ ONCE and stores it durably as the pre-release vX.Y.Z-rc.N: asset
#                te-tengo-landing-X.Y.Z.tar.gz + SHA256SUMS, notes with the commit, the git tree hash,
#                the SHA-256 of every asset, the dist/ fingerprint and the build number.
#   staging      [approval on `staging`] downloads that bundle, verifies it and deploys it to the
#                alias `staging` (https://staging.te-tengo-landing.pages.dev) + smoke check.
#   release-pr   opens (or updates) the pull request release/x.y.z → main, titled `release: x.y.z`,
#                with the candidate, its hashes and the staging URL.
#
# Production is NOT here: merging that pull request runs produccion.yml on main, which deploys the
# same bundle (found by the tree hash of main) and only then tags vX.Y.Z. A new push to the release
# branch builds rc.N+1 and updates the pull request; older candidates are kept, never changed.
#
# The bundle carries the final version (dist/version.json: version, build, commit); "rc" only lives
# in the pre-release name. N = 1 + the highest existing vX.Y.Z-rc.* (release or tag).
#
# Switch (organization Actions variable; a repository variable with the same name wins). Only `true`
# turns it on; unset means off, the job shows as skipped and the run summary says why:
#   ENABLE_STAGING   the staging job. Off: the pull request to main opens right after the candidate.
#
# Without the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets the candidate is still built and
# stored, staging is skipped with a notice and the pull request says so.
on:
  push:
    branches: ["release/**", "hotfix/**"]

permissions:
  contents: read

env:
  PAGES_PROJECT: te-tengo-landing
  WRANGLER_VERSION: 4.149.0
  PRODUCTION_URL: https://tetengo.reqsai.tech

jobs:
  candidate:
    name: Build the candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # creates the pre-release vX.Y.Z-rc.N and its tag
    # One candidate at a time, so two quick pushes never pick the same rc number.
    concurrency:
      group: release-candidate
      cancel-in-progress: false
    outputs:
      cloudflare: ${{ steps.version.outputs.cloudflare }}
      version: ${{ steps.version.outputs.version }}
      commit-message: ${{ steps.version.outputs.commit-message }}
      tree: ${{ steps.version.outputs.tree }}
      build: ${{ steps.version.outputs.build }}
      archive: ${{ steps.pack.outputs.archive }}
      archive-sha256: ${{ steps.pack.outputs.archive-sha256 }}
      dist-sha256: ${{ steps.pack.outputs.dist-sha256 }}
      tag: ${{ steps.publish.outputs.tag }}
      candidate: ${{ steps.publish.outputs.candidate }}
      release-url: ${{ steps.publish.outputs.url }}
    env:
      GH_TOKEN: ${{ github.token }}
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      ENABLE_STAGING: ${{ vars.ENABLE_STAGING }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The branch names the version and package.json carries it; both must agree, and the version
      # must not be released yet (a fix to a released version is a hotfix with a new version).
      - name: Check the version
        id: version
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid version::package.json version '${version}' is not X.Y.Z."
            exit 1
          fi
          if [ "${GITHUB_REF_NAME#*/}" != "$version" ]; then
            echo "::error title=Version mismatch::Branch ${GITHUB_REF_NAME} but package.json says ${version}. Set \"version\": \"${GITHUB_REF_NAME#*/}\" in package.json (and its CHANGELOG section) on this branch."
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}" > /dev/null 2>&1; then
            echo "::error title=Already released::v${version} already exists. A change to a released version needs a new version (hotfix/x.y.z+1)."
            exit 1
          fi
          if ! grep -qF "## [${version}]" CHANGELOG.md; then
            echo "::warning title=No CHANGELOG section::CHANGELOG.md has no '## [${version}]' section; the final release notes will only link to the file. Add it on this branch."
          fi
          {
            echo "version=${version}"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "commit-message=$(git log -1 --format=%s HEAD)"
            echo "build=${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            echo "cloudflare=${HAS_CLOUDFLARE}"
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_DESCARGAS_BASE_URL: ${{ vars.DESCARGAS_BASE_URL }}
          PUBLIC_APP_URL: ${{ vars.APP_URL }}
        run: pnpm build

      # dist/version.json names the final version and the build, never "rc": the same bytes go to
      # staging and production (https://tetengo.reqsai.tech/version.json tells what is live).
      - name: Pack the bundle
        id: pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          jq -n --arg version "$VERSION" --arg build "$BUILD" --arg commit "$GITHUB_SHA" \
            '{version: $version, build: $build, commit: $commit}' > dist/version.json
          # One hash over every file of dist/ (path and content), recomputed after every download.
          fingerprint=$(cd dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          archive="te-tengo-landing-${VERSION}.tar.gz"
          mkdir -p "$RUNNER_TEMP/bundle"
          tar -C dist -czf "$RUNNER_TEMP/bundle/${archive}" .
          (cd "$RUNNER_TEMP/bundle" && sha256sum "$archive" > SHA256SUMS)
          sha=$(cut -d' ' -f1 "$RUNNER_TEMP/bundle/SHA256SUMS")
          {
            echo "archive=${archive}"
            echo "archive-sha256=${sha}"
            echo "dist-sha256=${fingerprint}"
          } >> "$GITHUB_OUTPUT"

      # Actions artifacts expire; a pre-release does not. The block under "Candidate record" is read
      # by produccion.yml and rollback.yml: do not edit it by hand.
      - name: Store the candidate as a pre-release
        id: publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TREE: ${{ steps.version.outputs.tree }}
          BUILD: ${{ steps.version.outputs.build }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
          ARCHIVE_SHA256: ${{ steps.pack.outputs.archive-sha256 }}
          DIST_SHA256: ${{ steps.pack.outputs.dist-sha256 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          last=$({
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name'
            gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v${VERSION}-rc." \
              --jq '.[].ref | sub("^refs/tags/"; "")'
          } | sed -n "s/^v${VERSION//./\\.}-rc\.\([0-9][0-9]*\)$/\1/p" | sort -n | tail -n1)
          rc=$(( ${last:-0} + 1 ))
          candidate="${VERSION}-rc.${rc}"
          tag="v${candidate}"
          sums_sha=$(sha256sum "$RUNNER_TEMP/bundle/SHA256SUMS" | cut -d' ' -f1)
          {
            echo "Release candidate **${candidate}** of the landing, built once from \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA:0:12}\` (build \`${VERSION}+${BUILD}\`)."
            echo
            echo "It goes to staging from the release branch and, after the pull request to \`main\` is merged, to production (\`produccion.yml\`) without rebuilding. The final release \`v${VERSION}\` is created only after production succeeds."
            echo
            echo "| Asset | SHA-256 |"
            echo "|---|---|"
            echo "| \`${ARCHIVE}\` | \`${ARCHIVE_SHA256}\` |"
            echo "| \`SHA256SUMS\` | \`${sums_sha}\` |"
            echo
            echo "Candidate record (read by the workflows):"
            echo
            echo '```text'
            echo "version: ${VERSION}"
            echo "candidate: ${candidate}"
            echo "build: ${BUILD}"
            echo "commit: ${GITHUB_SHA}"
            echo "tree: ${TREE}"
            echo "archive: ${ARCHIVE}"
            echo "archive-sha256: ${ARCHIVE_SHA256}"
            echo "dist-sha256: ${DIST_SHA256}"
            echo "run: ${RUN_URL}"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          url=$(gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "$candidate" --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP/bundle/${ARCHIVE}" "$RUNNER_TEMP/bundle/SHA256SUMS")
          {
            echo "tag=${tag}"
            echo "candidate=${candidate}"
            echo "url=${url}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Candidate ${candidate}"
            echo "- Pre-release: ${url}"
            echo "- Commit \`${GITHUB_SHA:0:12}\`, tree \`${TREE:0:12}\`, build \`${VERSION}+${BUILD}\`"
            echo "- \`${ARCHIVE}\` SHA-256 \`${ARCHIVE_SHA256:0:16}\`, dist/ fingerprint \`${DIST_SHA256:0:16}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Explain skipped stages
        run: |
          set -euo pipefail
          if [ "$HAS_CLOUDFLARE" != true ]; then
            echo "::notice title=Staging not deployed: Cloudflare secrets missing::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (docs/DEPLOY.md). The candidate is stored; staging is skipped."
            echo "- Staging: skipped, the Cloudflare secrets are missing" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$ENABLE_STAGING" != true ]; then
            echo "::notice title=Staging switched off::The Actions variable ENABLE_STAGING is not 'true', so the staging alias is skipped and the pull request to main opens now."
            echo "- Staging: skipped, switched off (\`ENABLE_STAGING\` is not \`true\`)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # The candidate goes to the alias `staging` (https://staging.te-tengo-landing.pages.dev) and is
  # checked there before anyone merges the release into main.
  staging:
    name: Staging (alias staging)
    needs: candidate
    if: needs.candidate.outputs.cloudflare == 'true' && vars.ENABLE_STAGING == 'true'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.alias-url }}
    concurrency:
      group: deploy-${{ github.ref }}-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
      superseded: ${{ steps.deploy.outputs.superseded }}
      url: ${{ steps.deploy.outputs.alias-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/
            scripts/smoke-check.sh
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/pages-deploy
        id: deploy
        with:
          branch: staging
          head-ref: ${{ github.ref_name }}
          github-token: ${{ github.token }}
          release-tag: ${{ needs.candidate.outputs.tag }}
          archive: ${{ needs.candidate.outputs.archive }}
          archive-sha256: ${{ needs.candidate.outputs.archive-sha256 }}
          expected-sha256: ${{ needs.candidate.outputs.dist-sha256 }}
          commit-message: ${{ needs.candidate.outputs.commit-message }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          project: ${{ env.PAGES_PROJECT }}
          wrangler-version: ${{ env.WRANGLER_VERSION }}
      - name: Smoke check
        if: steps.deploy.outputs.deployed == 'true'
        env:
          URL: ${{ steps.deploy.outputs.alias-url }}
          CANONICAL: ${{ vars.SITE_URL || env.PRODUCTION_URL }}
        run: bash scripts/smoke-check.sh "$URL" "$CANONICAL" dist/index.html
      - name: Summary
        if: always()
        env:
          CANDIDATE: ${{ needs.candidate.outputs.candidate }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.alias-url }}
        run: |
          {
            echo "### Staging (alias \`staging\`)"
            echo "- Candidate: ${CANDIDATE}"
            echo "- Alias: ${ALIAS:-not deployed}"
            echo "- Deployment: ${URL:-not deployed}"
          } >> "$GITHUB_STEP_SUMMARY"

  # After staging (or with staging switched off or without Cloudflare secrets): open the pull request
  # <release branch> → main, or update it with the new candidate. Merging it is a human action (the
  # proteger-main ruleset); the push to main then runs produccion.yml.
  release-pr:
    name: Open the release pull request
    needs: [candidate, staging]
    if: >-
      !cancelled() && needs.candidate.result == 'success'
      && (needs.staging.result == 'success' || needs.staging.result == 'skipped')
      && needs.staging.outputs.superseded != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.candidate.outputs.version }}
      CANDIDATE: ${{ needs.candidate.outputs.candidate }}
      RELEASE_URL: ${{ needs.candidate.outputs.release-url }}
      BUILD: ${{ needs.candidate.outputs.build }}
      TREE: ${{ needs.candidate.outputs.tree }}
      ARCHIVE: ${{ needs.candidate.outputs.archive }}
      ARCHIVE_SHA256: ${{ needs.candidate.outputs.archive-sha256 }}
      DIST_SHA256: ${{ needs.candidate.outputs.dist-sha256 }}
      CLOUDFLARE: ${{ needs.candidate.outputs.cloudflare }}
      STAGING_RESULT: ${{ needs.staging.result }}
      STAGING_URL: ${{ needs.staging.outputs.url }}
      ENABLE_STAGING: ${{ vars.ENABLE_STAGING }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the pull request to main
        run: |
          set -euo pipefail
          if [ "$STAGING_RESULT" = success ]; then
            staging="deployed and smoke-checked: ${STAGING_URL:-https://staging.te-tengo-landing.pages.dev}"
          elif [ "$CLOUDFLARE" != true ]; then
            staging="not deployed: the Cloudflare secrets are missing"
          elif [ "$ENABLE_STAGING" != true ]; then
            staging="not deployed: switched off (\`ENABLE_STAGING\` is not \`true\`)"
          else
            staging="not deployed"
          fi
          {
            echo "Release \`${VERSION}\` of the landing from \`${GITHUB_REF_NAME}\`."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Candidate | [${CANDIDATE}](${RELEASE_URL}) (build \`${VERSION}+${BUILD}\`) |"
            echo "| Commit / tree | \`${GITHUB_SHA:0:12}\` / \`${TREE}\` |"
            echo "| Bundle | \`${ARCHIVE}\`, SHA-256 \`${ARCHIVE_SHA256}\` |"
            echo "| dist/ fingerprint | \`${DIST_SHA256}\` |"
            echo "| Staging | ${staging} |"
            echo "| Pipeline run | ${RUN_URL} |"
            echo
            echo "Merging runs \`produccion.yml\` on \`main\`: it finds this candidate by the tree hash of \`main\` (it must equal \`${TREE:0:12}\`: true for any merge method as long as \`main\` has nothing this branch lacks; otherwise merge \`main\` into this branch first, which builds a new candidate), deploys the same bundle to https://tetengo.reqsai.tech after the \`produccion\` approval, and only then creates \`v${VERSION}\` and the pull request \`main → develop\`. A new push to \`${GITHUB_REF_NAME}\` builds the next candidate and updates this pull request."
          } > "$RUNNER_TEMP/body.md"

          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --base main --state open \
            --json number --jq '.[0].number // ""')
          if [ -n "$number" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${number}" -F "body=@${RUNNER_TEMP}/body.md" > /dev/null
            gh pr comment "$number" --repo "$GITHUB_REPOSITORY" \
              --body "New candidate [${CANDIDATE}](${RELEASE_URL}) (commit \`${GITHUB_SHA:0:12}\`); staging: ${staging}. The description now describes it."
            echo "- Release pull request #${number} updated with ${CANDIDATE}" >> "$GITHUB_STEP_SUMMARY"
          else
            url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$GITHUB_REF_NAME" \
              --title "release: ${VERSION}" --body-file "$RUNNER_TEMP/body.md")
            echo "- Release pull request opened: $url" >> "$GITHUB_STEP_SUMMARY"
          fi
