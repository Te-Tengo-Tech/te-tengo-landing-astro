<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Poppins";
        src: url("FONT_400") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Poppins";
        src: url("FONT_700") format("woff2");
        font-weight: 700;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: radial-gradient(900px 500px at 100% 0%, #ffede8, transparent 70%), #fff7f1;
        color: #2b1d4e;
        font-family: "Poppins", sans-serif;
        display: grid;
        grid-template-columns: 1fr 430px;
        gap: 56px;
        align-items: center;
        padding: 64px 72px;
      }
      .logo {
        height: 58px;
        display: block;
      }
      h1 {
        margin-top: 40px;
        font-size: 60px;
        line-height: 1.06;
        font-weight: 700;
        letter-spacing: -0.035em;
      }
      p {
        margin-top: 24px;
        font-size: 25px;
        line-height: 1.45;
        color: #5a4f70;
        max-width: 28ch;
      }
      .photo {
        height: 500px;
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 30px 60px -24px rgba(43, 29, 78, 0.45);
      }
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 30%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div>
      LOGO_SVG
      <h1>Cuida a tu familiar aunque no estés en casa.</h1>
      <p>Una webcam en su casa reconoce caídas y te avisa al instante en tu celular.</p>
    </div>
    <div class="photo"><img src="PHOTO_URL" alt="" /></div>
  </body>
</html>
