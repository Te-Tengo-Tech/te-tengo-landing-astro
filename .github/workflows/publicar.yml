name: Publicar
run-name: >-
  ${{ github.event_name == 'repository_dispatch'
  && format('Publicar {0} {1}', github.event.action, github.event.client_payload.version)
  || format('Publicar manual ({0})', inputs.partes) }}

# Builds the Te Tengo apps from their repositories and, after an approval, publishes them
# (docs/DEPLOY.md):
#   - Android: universal APK `te-tengo.apk`, built by the mobile repository's reusable workflow
#     build-apk.yml (te-tengo-mobile-flutter, docs/RELEASE_ANDROID.md);
#   - Web: the Flutter PWA (te-tengo-mobile-flutter `web/`, docs/WEB_PWA.md), built with base href /
#     for the root of its own origin;
#   - Windows: installer `te-tengo-captura-setup.exe` (te-tengo-desktop-pywebview, its PyInstaller
#     spec and Inno Setup script).
# Publishing uploads the binaries and their .sha256 files to Cloudflare R2 under stable keys and
# deploys the PWA to the Pages project te-tengo-app (https://app.tetengo.reqsai.tech); a manual run of
# every part also redeploys this landing (te-tengo-landing, https://tetengo.reqsai.tech).
#
# TRIGGERS
#   repository_dispatch, sent by the app repositories when a release reaches their main branch
#   (their notificar-landing.yml, after CI passes on main). client_payload: {ref, version}, where ref
#   is the commit SHA (or tag) of the source repository and version its app version.
#     publicar-movil       → APK + PWA from te-tengo-mobile-flutter@ref
#     publicar-escritorio  → Windows installer from te-tengo-desktop-pywebview@ref
#   workflow_dispatch, by hand: every part or the selected one, from the chosen refs. With
#   `publicar: false` (the default) everything stays as run artifacts.
#
# APPROVAL: the build jobs run without an environment. Every job that uploads to R2 or deploys to
# Cloudflare Pages runs in the `produccion` environment, whose required reviewers approve the run on
# its page (Review deployments) after the builds and the `revisar` checks succeed; nothing reaches
# users before that. The environment only accepts the main branch; repository_dispatch always runs on
# the default branch (main). All publishing jobs of a run wait at the same time, so one approval
# covers them.
#
# Secrets (Settings → Secrets and variables → Actions). Every step whose secret is missing emits a
# ::notice and is skipped:
#   TT_REPOS_TOKEN             fine-grained token, read-only Contents on te-tengo-mobile-flutter and
#                              te-tengo-desktop-pywebview (passed to build-apk.yml as MOBILE_REPO_TOKEN)
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#                              the release key, the same as in the mobile repository
#   GOOGLE_SERVICES_JSON       base64 of google-services.json (push on Android)
#   CLOUDFLARE_API_TOKEN       Cloudflare Pages: Edit + Workers R2 Storage: Edit
#   CLOUDFLARE_ACCOUNT_ID      Cloudflare account ID
# Variables:
#   TT_API_URL                 HTTPS URL of the production API (APK and PWA)
#   DESCARGAS_R2_BUCKET        name of the R2 bucket (e.g. te-tengo-descargas)
#   DESCARGAS_BASE_URL         public URL of that bucket (r2.dev or custom domain), used by the site
#   TT_FIREBASE_WEB_* and TT_FCM_VAPID_KEY   Firebase web config of the PWA (public values)
#
# Hardening: no push or pull_request trigger, GitHub-hosted runners, actions pinned to commit SHAs, no
# dependency caches in the build jobs, no credentials persisted in checkouts, inputs and the dispatch
# payload validated and passed through env, minimal permissions per job.
on:
  repository_dispatch:
    types: [publicar-movil, publicar-escritorio]
  workflow_dispatch:
    inputs:
      partes:
        description: Qué construir y publicar
        type: choice
        options: [todo, movil, escritorio]
        default: todo
      ref_mobile:
        description: Rama, tag o commit de te-tengo-mobile-flutter (APK y PWA)
        required: true
        default: main
      ref_desktop:
        description: Rama, tag o commit de te-tengo-desktop-pywebview (instalador de Windows)
        required: true
        default: main
      build_number:
        description: versionCode del APK (vacío = el +N de pubspec.yaml). Debe crecer en cada publicación
        required: false
        default: ""
      publicar:
        description: Subir a R2 y desplegar (con aprobación en «produccion»); si es false, solo artefactos
        type: boolean
        default: false
      permitir_apk_sin_firma:
        description: Publicar aunque el APK esté firmado con la clave de depuración (no recomendado)
        type: boolean
        default: false

permissions: {}

# One queue per kind of publication: a mobile and a desktop release can wait for approval at the same
# time. A newer release of the same kind replaces one that is still queued behind a running one.
concurrency:
  group: publicar-${{ github.event_name == 'repository_dispatch' && github.event.action || 'manual' }}
  cancel-in-progress: false

env:
  ORG: Te-Tengo-Tech
  REPO_MOBILE: te-tengo-mobile-flutter
  REPO_DESKTOP: te-tengo-desktop-pywebview
  FLUTTER_VERSION: 3.44.8
  WRANGLER_VERSION: 4.149.0
  PAGES_PROJECT: te-tengo-landing
  APP_PAGES_PROJECT: te-tengo-app

jobs:
  preparar:
    name: Check the configuration and resolve the refs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      listo: ${{ steps.config.outputs.listo }}
      movil: ${{ steps.config.outputs.movil }}
      escritorio: ${{ steps.config.outputs.escritorio }}
      publicar: ${{ steps.config.outputs.publicar }}
      landing: ${{ steps.config.outputs.landing }}
      build_number: ${{ steps.config.outputs.build_number }}
      permitir_apk_sin_firma: ${{ steps.config.outputs.permitir_apk_sin_firma }}
      version: ${{ steps.config.outputs.version }}
      cloudflare: ${{ steps.config.outputs.cloudflare }}
      r2: ${{ steps.config.outputs.r2 }}
      retencion: ${{ steps.config.outputs.retencion }}
      sha_mobile: ${{ steps.refs.outputs.sha_mobile }}
      sha_desktop: ${{ steps.refs.outputs.sha_desktop }}
      web: ${{ steps.refs.outputs.web }}
    env:
      TT_REPOS_TOKEN: ${{ secrets.TT_REPOS_TOKEN }}
      EVENTO: ${{ github.event_name }}
      # repository_dispatch: the event type and the payload sent by the app repository.
      TIPO: ${{ github.event.action }}
      PAYLOAD_REF: ${{ github.event.client_payload.ref }}
      PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
      # workflow_dispatch inputs (empty on repository_dispatch).
      PARTES: ${{ inputs.partes }}
      INPUT_REF_MOBILE: ${{ inputs.ref_mobile }}
      INPUT_REF_DESKTOP: ${{ inputs.ref_desktop }}
      INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
      INPUT_PUBLICAR: ${{ inputs.publicar }}
      INPUT_PERMITIR: ${{ inputs.permitir_apk_sin_firma }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
      HAS_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      TT_API_URL: ${{ vars.TT_API_URL || secrets.TT_API_URL }}
      R2_BUCKET: ${{ vars.DESCARGAS_R2_BUCKET }}
      DESCARGAS_BASE_URL: ${{ vars.DESCARGAS_BASE_URL }}
    steps:
      - name: Check the trigger, the inputs and the secrets
        id: config
        run: |
          set -euo pipefail
          version=""
          ref_mobile=""
          ref_desktop=""
          case "$EVENTO" in
            repository_dispatch)
              case "$TIPO" in
                publicar-movil) movil=true escritorio=false ref_mobile=$PAYLOAD_REF ;;
                publicar-escritorio) movil=false escritorio=true ref_desktop=$PAYLOAD_REF ;;
                *)
                  echo "::error title=Unknown dispatch type::'$TIPO' is not publicar-movil or publicar-escritorio."
                  exit 1
                  ;;
              esac
              if [ -z "$PAYLOAD_REF" ]; then
                echo "::error title=client_payload.ref missing::The dispatch must send client_payload.ref (commit SHA or tag of the source repository)."
                exit 1
              fi
              if [[ ! "$PAYLOAD_VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]{0,63}$ ]]; then
                echo "::warning title=client_payload.version ignored::'$PAYLOAD_VERSION' is not a version string."
              else
                version=$PAYLOAD_VERSION
              fi
              # A release that reached main is always meant to be published; the approval is the gate.
              publicar=true
              landing=false
              build_number=""
              permitir=false
              ;;
            workflow_dispatch)
              case "$PARTES" in
                todo) movil=true escritorio=true ;;
                movil) movil=true escritorio=false ;;
                escritorio) movil=false escritorio=true ;;
                *)
                  echo "::error title=Invalid partes::'$PARTES'."
                  exit 1
                  ;;
              esac
              if [ "$movil" = true ]; then ref_mobile=$INPUT_REF_MOBILE; fi
              if [ "$escritorio" = true ]; then ref_desktop=$INPUT_REF_DESKTOP; fi
              publicar=$INPUT_PUBLICAR
              # The landing does not depend on the binaries; deploy.yml deploys it on every push to
              # main. A manual run of every part redeploys it too (e.g. after changing a variable).
              if [ "$publicar" = true ] && [ "$PARTES" = todo ]; then landing=true; else landing=false; fi
              build_number=$INPUT_BUILD_NUMBER
              permitir=$INPUT_PERMITIR
              ;;
            *)
              echo "::error title=Unexpected event::$EVENTO"
              exit 1
              ;;
          esac

          for ref in "$ref_mobile" "$ref_desktop"; do
            [ -n "$ref" ] || continue
            if [[ ! "$ref" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || [[ "$ref" == *..* ]]; then
              echo "::error title=Invalid ref::'$ref' is not a branch, tag or commit name."
              exit 1
            fi
          done
          if [ -n "$build_number" ] && [[ ! "$build_number" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid build_number::'$build_number' must be a positive integer."
            exit 1
          fi
          if [ "$publicar" = true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error title=Publish only from main::Run the workflow from the main branch to publish (the produccion environment only accepts main)."
            exit 1
          fi

          cloudflare=$HAS_CLOUDFLARE
          if [ -n "$R2_BUCKET" ]; then r2=true; else r2=false; fi
          # Artifacts must outlive the wait for approval (an approval request expires after 30 days).
          if [ "$publicar" = true ]; then retencion=30; else retencion=7; fi
          {
            echo "movil=$movil"
            echo "escritorio=$escritorio"
            echo "publicar=$publicar"
            echo "landing=$landing"
            echo "build_number=$build_number"
            echo "permitir_apk_sin_firma=$permitir"
            echo "version=$version"
            echo "cloudflare=$cloudflare"
            echo "r2=$r2"
            echo "retencion=$retencion"
            echo "ref_mobile=$ref_mobile"
            echo "ref_desktop=$ref_desktop"
          } >> "$GITHUB_OUTPUT"

          if [ -z "$TT_REPOS_TOKEN" ]; then
            echo "::notice title=Nothing built: TT_REPOS_TOKEN is missing::Create a fine-grained token (resource owner Te-Tengo-Tech; repositories te-tengo-mobile-flutter and te-tengo-desktop-pywebview; permission Contents: Read-only) and save it as the TT_REPOS_TOKEN secret. See docs/DEPLOY.md."
            {
              echo "### Nothing was built"
              echo "The \`TT_REPOS_TOKEN\` secret is missing, so the app repositories cannot be checked out. See docs/DEPLOY.md."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "listo=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          avisos=()
          if [ "$movil" = true ]; then
            [ "$HAS_KEYSTORE" = true ] || avisos+=("ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD: the APK is debug-signed and will not be published")
            [ "$HAS_FIREBASE" = true ] || avisos+=("GOOGLE_SERVICES_JSON: the APK is built without push notifications")
          fi
          [ -n "$TT_API_URL" ] || avisos+=("TT_API_URL: the apps would point to a local backend")
          if [ "$publicar" = true ]; then
            [ "$cloudflare" = true ] || avisos+=("CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID: nothing will be uploaded or deployed")
            [ "$r2" = true ] || avisos+=("DESCARGAS_R2_BUCKET: the binaries will not be uploaded to R2")
            [ -n "$DESCARGAS_BASE_URL" ] || avisos+=("DESCARGAS_BASE_URL: the site will show the downloads as «Próximamente»")
          fi
          if [ ${#avisos[@]} -gt 0 ]; then
            echo "::notice title=Incomplete configuration::$(IFS=';'; echo "${avisos[*]}")"
          fi
          echo "listo=true" >> "$GITHUB_OUTPUT"

      - name: Resolve the refs of the app repositories
        id: refs
        if: steps.config.outputs.listo == 'true'
        env:
          GH_TOKEN: ${{ secrets.TT_REPOS_TOKEN }}
          REF_MOBILE: ${{ steps.config.outputs.ref_mobile }}
          REF_DESKTOP: ${{ steps.config.outputs.ref_desktop }}
          PUBLICAR: ${{ steps.config.outputs.publicar }}
          VERSION: ${{ steps.config.outputs.version }}
        run: |
          set -euo pipefail
          resolver() {
            local repo=$1 ref=$2 sha
            if ! sha=$(gh api "repos/$ORG/$repo/commits/$ref" -q .sha 2> /dev/null); then
              echo "::error title=Cannot read $repo::Ref '$ref' not found, or TT_REPOS_TOKEN has no Contents read access to $ORG/$repo."
              return 1
            fi
            echo "$sha"
          }
          sha_mobile=""
          sha_desktop=""
          web=false
          if [ -n "$REF_MOBILE" ]; then
            sha_mobile=$(resolver "$REPO_MOBILE" "$REF_MOBILE")
            if gh api "repos/$ORG/$REPO_MOBILE/contents/web/index.html?ref=$sha_mobile" > /dev/null 2>&1; then
              web=true
            else
              echo "::notice title=PWA skipped::$REPO_MOBILE@$REF_MOBILE has no web/ folder."
            fi
          fi
          if [ -n "$REF_DESKTOP" ]; then
            sha_desktop=$(resolver "$REPO_DESKTOP" "$REF_DESKTOP")
          fi
          {
            echo "sha_mobile=$sha_mobile"
            echo "sha_desktop=$sha_desktop"
            echo "web=$web"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Sources"
            echo "Trigger: \`$EVENTO\`${TIPO:+ (\`$TIPO\`)}${VERSION:+, version \`$VERSION\`}"
            echo
            echo "| Repository | Ref | Commit |"
            echo "|---|---|---|"
            if [ -n "$sha_mobile" ]; then echo "| $REPO_MOBILE | \`$REF_MOBILE\` | \`${sha_mobile:0:12}\` |"; fi
            if [ -n "$sha_desktop" ]; then echo "| $REPO_DESKTOP | \`$REF_DESKTOP\` | \`${sha_desktop:0:12}\` |"; fi
            echo
            echo "PWA: $web · Publish: $PUBLICAR"
          } >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Android APK
    needs: preparar
    if: needs.preparar.outputs.listo == 'true' && needs.preparar.outputs.movil == 'true'
    permissions:
      contents: read
    uses: Te-Tengo-Tech/te-tengo-mobile-flutter/.github/workflows/build-apk.yml@develop
    with:
      ref: ${{ needs.preparar.outputs.sha_mobile }}
      build_number: ${{ needs.preparar.outputs.build_number }}
      artifact_name: te-tengo-apk
      retention_days: ${{ fromJSON(needs.preparar.outputs.retencion) }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      TT_API_URL: ${{ vars.TT_API_URL || secrets.TT_API_URL }}
      # One token name in this repository; the mobile workflow calls it MOBILE_REPO_TOKEN.
      MOBILE_REPO_TOKEN: ${{ secrets.TT_REPOS_TOKEN }}

  windows:
    name: Windows installer
    needs: preparar
    if: needs.preparar.outputs.listo == 'true' && needs.preparar.outputs.escritorio == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions: {}
    outputs:
      version_agente: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.ORG }}/${{ env.REPO_DESKTOP }}
          ref: ${{ needs.preparar.outputs.sha_desktop }}
          token: ${{ secrets.TT_REPOS_TOKEN }}
          persist-credentials: false
          path: desktop

      - name: Version of the agent
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/te_tengo_captura/__init__.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Te Tengo Captura $version"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Install dependencies
        run: uv sync --locked --group empaquetado --quiet
      - name: Download the MediaPipe model
        shell: bash
        run: ./scripts/descargar_modelo.sh
      - name: Build with PyInstaller
        run: uv run pyinstaller packaging/te-tengo-captura.spec --noconfirm --log-level WARN
      - name: Smoke test the executable
        shell: pwsh
        run: |
          $exe = "dist/te-tengo-captura/te-tengo-captura.exe"
          $v = Start-Process -FilePath $exe -ArgumentList "--version" -Wait -PassThru
          if ($v.ExitCode -ne 0) { throw "--version exited with $($v.ExitCode)" }
          $p = Start-Process -FilePath $exe -ArgumentList "--autoprueba","--logs","logs" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content logs/te-tengo-captura.log; throw "--autoprueba exited with $($p.ExitCode)" }

      - name: Compile the installer (Inno Setup)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          & $iscc.FullName /Qp "/DAppVersion=$env:VERSION" packaging\te-tengo-captura.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited with $LASTEXITCODE" }
          New-Item -ItemType Directory -Force ..\salida | Out-Null
          $instalador = Get-ChildItem dist\instalador\*.exe | Select-Object -First 1
          Copy-Item $instalador.FullName ..\salida\te-tengo-captura-setup.exe
      - name: Install and uninstall test
        shell: pwsh
        working-directory: salida
        run: |
          $ErrorActionPreference = "Stop"
          $p = Start-Process .\te-tengo-captura-setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The installer exited with $($p.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA "Programs\TeTengoCaptura"
          $v = Start-Process (Join-Path $app "te-tengo-captura.exe") -ArgumentList "--version" -Wait -PassThru
          if ($v.ExitCode -ne 0) { throw "The installed --version exited with $($v.ExitCode)" }
          $u = Start-Process (Join-Path $app "unins000.exe") -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "The uninstaller exited with $($u.ExitCode)" }
      - name: Checksum
        shell: bash
        working-directory: salida
        run: sha256sum te-tengo-captura-setup.exe | tee te-tengo-captura-setup.exe.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: salida/
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.preparar.outputs.retencion) }}

  web:
    name: Web PWA
    needs: preparar
    if: >-
      needs.preparar.outputs.listo == 'true' && needs.preparar.outputs.movil == 'true'
      && needs.preparar.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    env:
      # Public Firebase web values (repository variables, never committed; docs/WEB_PWA.md of the
      # mobile repository). Only the ones that are set become --dart-define values.
      TT_API_URL: ${{ vars.TT_API_URL || secrets.TT_API_URL }}
      TT_FIREBASE_WEB_API_KEY: ${{ vars.TT_FIREBASE_WEB_API_KEY }}
      TT_FIREBASE_WEB_APP_ID: ${{ vars.TT_FIREBASE_WEB_APP_ID }}
      TT_FIREBASE_WEB_MESSAGING_SENDER_ID: ${{ vars.TT_FIREBASE_WEB_MESSAGING_SENDER_ID }}
      TT_FIREBASE_WEB_PROJECT_ID: ${{ vars.TT_FIREBASE_WEB_PROJECT_ID }}
      TT_FIREBASE_WEB_AUTH_DOMAIN: ${{ vars.TT_FIREBASE_WEB_AUTH_DOMAIN }}
      TT_FIREBASE_WEB_STORAGE_BUCKET: ${{ vars.TT_FIREBASE_WEB_STORAGE_BUCKET }}
      TT_FIREBASE_WEB_MEASUREMENT_ID: ${{ vars.TT_FIREBASE_WEB_MEASUREMENT_ID }}
      TT_FCM_VAPID_KEY: ${{ vars.TT_FCM_VAPID_KEY }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.ORG }}/${{ env.REPO_MOBILE }}
          ref: ${{ needs.preparar.outputs.sha_mobile }}
          token: ${{ secrets.TT_REPOS_TOKEN }}
          persist-credentials: false
          path: mobile
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
      - name: Build defines
        run: |
          set -euo pipefail
          jq -n 'env | with_entries(select((.key | test("^(TT_API_URL|TT_FIREBASE_WEB_[A-Z_]+|TT_FCM_VAPID_KEY)$")) and .value != ""))' \
            > "$RUNNER_TEMP/defines.json"
          echo "Defines: $(jq -r 'keys | join(", ")' "$RUNNER_TEMP/defines.json")"
          for required in TT_FIREBASE_WEB_API_KEY TT_FIREBASE_WEB_APP_ID TT_FIREBASE_WEB_MESSAGING_SENDER_ID TT_FIREBASE_WEB_PROJECT_ID TT_FCM_VAPID_KEY; do
            if ! jq -e --arg k "$required" 'has($k)' "$RUNNER_TEMP/defines.json" > /dev/null; then
              echo "::notice title=PWA without web push::The repository variable $required is missing; the PWA works but cannot receive notifications."
            fi
          done
      - name: Dependencies
        run: flutter pub get --enforce-lockfile
      # The PWA is the whole te-tengo-app site, so it lives at the root of its origin. Every URL in
      # web/ (manifest, icons, firebase-messaging-sw.js) is relative to the base href, so the worker's
      # scope becomes / and push keeps working.
      - name: Build the PWA
        run: |
          timeout 20m flutter build web --release \
            --base-href / \
            --no-web-resources-cdn \
            --dart-define-from-file="$RUNNER_TEMP/defines.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: mobile/build/web/
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.preparar.outputs.retencion) }}

  revisar:
    name: Check the builds before the approval
    needs: [preparar, android, windows, web]
    # Only when publishing, and only when every build this run asked for succeeded. `!cancelled()`
    # lets it run when the builds of the other app were skipped.
    if: >-
      !cancelled() && needs.preparar.result == 'success'
      && needs.preparar.outputs.listo == 'true' && needs.preparar.outputs.publicar == 'true'
      && (needs.preparar.outputs.movil != 'true' || needs.android.result == 'success')
      && (needs.preparar.outputs.escritorio != 'true' || needs.windows.result == 'success')
      && (needs.web.result == 'success' || needs.web.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      MOVIL: ${{ needs.preparar.outputs.movil }}
      ESCRITORIO: ${{ needs.preparar.outputs.escritorio }}
      WEB: ${{ needs.web.result }}
      LANDING: ${{ needs.preparar.outputs.landing }}
      CLOUDFLARE: ${{ needs.preparar.outputs.cloudflare }}
      R2: ${{ needs.preparar.outputs.r2 }}
      VERSION: ${{ needs.preparar.outputs.version }}
      SHA_MOBILE: ${{ needs.preparar.outputs.sha_mobile }}
      SHA_DESKTOP: ${{ needs.preparar.outputs.sha_desktop }}
      APK_SIGNED: ${{ needs.android.outputs.signed }}
      APK_CERT: ${{ needs.android.outputs.certificate_sha256 }}
      APK_VERSION: ${{ needs.android.outputs.version_name }} (${{ needs.android.outputs.version_code }})
      ALLOW_UNSIGNED: ${{ needs.preparar.outputs.permitir_apk_sin_firma }}
      VERSION_AGENTE: ${{ needs.windows.outputs.version_agente }}
    steps:
      - name: Refuse a debug-signed APK
        if: env.MOVIL == 'true'
        run: |
          if [ "$APK_SIGNED" != true ] && [ "$ALLOW_UNSIGNED" != true ]; then
            echo "::error title=APK not signed with the release key::A debug-signed APK cannot be updated by later builds. Add the four ANDROID_* secrets, or rerun by hand with permitir_apk_sin_firma=true for a throwaway test."
            exit 1
          fi
      - name: What the approval will publish
        run: |
          {
            echo "## Waiting for approval on \`produccion\`"
            echo "Approve it under **Review deployments** on this run's page. What will be published:"
            echo
            if [ "$MOVIL" = true ]; then
              echo "- Android APK $APK_VERSION from $REPO_MOBILE@\`${SHA_MOBILE:0:12}\`${VERSION:+ (release $VERSION)}"
              echo "  - Signed with the release key: $APK_SIGNED; certificate SHA-256 \`$APK_CERT\` (must be the same in every release)"
              echo "  - Destination: R2 \`te-tengo.apk\` — $([ "$CLOUDFLARE" = true ] && [ "$R2" = true ] && echo "will be uploaded" || echo "skipped, Cloudflare or DESCARGAS_R2_BUCKET missing")"
              if [ "$WEB" = success ]; then
                echo "- PWA → $APP_PAGES_PROJECT (https://app.tetengo.reqsai.tech) — $([ "$CLOUDFLARE" = true ] && echo "will be deployed" || echo "skipped, Cloudflare secrets missing")"
              else
                echo "- PWA: not built in this run; the current deployment stays"
              fi
            fi
            if [ "$ESCRITORIO" = true ]; then
              echo "- Te Tengo Captura $VERSION_AGENTE (Windows installer) from $REPO_DESKTOP@\`${SHA_DESKTOP:0:12}\`"
              echo "  - Destination: R2 \`te-tengo-captura-setup.exe\` — $([ "$CLOUDFLARE" = true ] && [ "$R2" = true ] && echo "will be uploaded" || echo "skipped, Cloudflare or DESCARGAS_R2_BUCKET missing")"
            fi
            if [ "$LANDING" = true ]; then
              echo "- Landing → $PAGES_PROJECT (https://tetengo.reqsai.tech) — $([ "$CLOUDFLARE" = true ] && echo "will be deployed" || echo "skipped, Cloudflare secrets missing")"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  descargas:
    name: Upload the binaries to R2
    needs: [preparar, android, windows, revisar]
    if: >-
      !cancelled() && needs.revisar.result == 'success'
      && needs.preparar.outputs.cloudflare == 'true' && needs.preparar.outputs.r2 == 'true'
    environment:
      name: produccion
      url: https://tetengo.reqsai.tech/#descargas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.DESCARGAS_R2_BUCKET }}
      DESCARGAS_BASE_URL: ${{ vars.DESCARGAS_BASE_URL }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.preparar.outputs.movil == 'true'
        with:
          name: ${{ needs.android.outputs.artifact_name }}
          path: salida
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.preparar.outputs.escritorio == 'true'
        with:
          name: windows
          path: salida
      - name: Upload to Cloudflare R2
        working-directory: salida
        run: |
          set -euo pipefail
          put() {
            local file=$1 type=$2 disposition=$3
            [ -f "$file" ] || return 0
            npx --yes "wrangler@$WRANGLER_VERSION" r2 object put "$R2_BUCKET/$file" --remote \
              --file "$file" --content-type "$type" --cache-control "no-cache" \
              ${disposition:+--content-disposition "$disposition"}
            echo "- \`$file\`: ${DESCARGAS_BASE_URL:-<DESCARGAS_BASE_URL>}/$file" >> "$GITHUB_STEP_SUMMARY"
          }
          echo "## Uploaded to R2 ($R2_BUCKET)" >> "$GITHUB_STEP_SUMMARY"
          put te-tengo.apk application/vnd.android.package-archive 'attachment; filename="te-tengo.apk"'
          put te-tengo.apk.sha256 "text/plain; charset=utf-8" ""
          put te-tengo-captura-setup.exe application/vnd.microsoft.portable-executable 'attachment; filename="te-tengo-captura-setup.exe"'
          put te-tengo-captura-setup.exe.sha256 "text/plain; charset=utf-8" ""

  app:
    name: Deploy the PWA to Cloudflare Pages
    needs: [preparar, web, revisar]
    # Only when the PWA was built in this run. A run without a PWA leaves the current te-tengo-app
    # deployment untouched.
    if: >-
      !cancelled() && needs.revisar.result == 'success' && needs.web.result == 'success'
      && needs.preparar.outputs.cloudflare == 'true'
    environment:
      name: produccion
      url: https://app.tetengo.reqsai.tech
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SHA_MOBILE: ${{ needs.preparar.outputs.sha_mobile }}
    steps:
      # Only the PWA's Pages files (_headers, robots.txt) from this repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: sitio
          sparse-checkout: deploy/app
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: web
      - name: Add the Pages files of the PWA
        run: |
          set -euo pipefail
          test -f web/index.html
          test -f web/firebase-messaging-sw.js
          test -f web/manifest.json
          cp sitio/deploy/app/_headers sitio/deploy/app/robots.txt web/
          echo "PWA: $(find web -type f | wc -l) files."
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: sitio/.nvmrc
      - name: Create the Pages project if it does not exist
        run: |
          if ! npx --yes "wrangler@$WRANGLER_VERSION" pages project list 2> /dev/null | grep -q " $APP_PAGES_PROJECT "; then
            npx --yes "wrangler@$WRANGLER_VERSION" pages project create "$APP_PAGES_PROJECT" --production-branch main --force
          fi
      - name: Deploy the PWA to Cloudflare Pages (production)
        id: pages
        # Same pattern as the landing: Wrangler through npx. The commit hash is the mobile commit the
        # PWA was built from.
        run: |
          set -o pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" pages deploy web --project-name="$APP_PAGES_PROJECT" \
            --branch=main --commit-hash="$SHA_MOBILE" --commit-message="$REPO_MOBILE ${SHA_MOBILE:0:12}" \
            | tee "$RUNNER_TEMP/pages-deploy-app.log"
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' "$RUNNER_TEMP/pages-deploy-app.log" | head -n1)
          echo "deployment-url=${url}" >> "$GITHUB_OUTPUT"
      - name: Summary
        if: always()
        env:
          URL: ${{ steps.pages.outputs.deployment-url }}
        run: |
          {
            echo "## Te Tengo web app"
            echo "- Built from $REPO_MOBILE@\`${SHA_MOBILE:0:12}\`"
            echo "- PWA ($APP_PAGES_PROJECT): ${URL:-not deployed}"
          } >> "$GITHUB_STEP_SUMMARY"

  landing:
    name: Deploy the landing to Cloudflare Pages
    needs: [preparar, revisar]
    # Manual runs of every part only; deploy.yml deploys the landing on every push to main.
    if: >-
      !cancelled() && needs.revisar.result == 'success' && needs.preparar.outputs.landing == 'true'
      && needs.preparar.outputs.cloudflare == 'true'
    environment:
      name: produccion
      url: https://tetengo.reqsai.tech
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: sitio
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: sitio/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: sitio/.nvmrc
      - name: Build the landing
        working-directory: sitio
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_DESCARGAS_BASE_URL: ${{ vars.DESCARGAS_BASE_URL }}
          PUBLIC_APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build
      - name: Create the Pages project if it does not exist
        run: |
          if ! npx --yes "wrangler@$WRANGLER_VERSION" pages project list 2> /dev/null | grep -q " $PAGES_PROJECT "; then
            npx --yes "wrangler@$WRANGLER_VERSION" pages project create "$PAGES_PROJECT" --production-branch main --force
          fi
      - name: Deploy the landing to Cloudflare Pages (production)
        id: pages
        # Wrangler through npx, outside the project's pnpm install: cloudflare/wrangler-action adds
        # wrangler with pnpm, whose build-script policy blocks esbuild/workerd (ERR_PNPM_IGNORED_BUILDS).
        run: |
          set -o pipefail
          cd sitio
          npx --yes "wrangler@$WRANGLER_VERSION" pages deploy dist --project-name="$PAGES_PROJECT" \
            --branch=main --commit-hash="$GITHUB_SHA" | tee "$RUNNER_TEMP/pages-deploy.log"
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' "$RUNNER_TEMP/pages-deploy.log" | head -n1)
          echo "deployment-url=${url}" >> "$GITHUB_OUTPUT"
      - name: Summary
        if: always()
        env:
          URL: ${{ steps.pages.outputs.deployment-url }}
        run: |
          echo "- Landing ($PAGES_PROJECT): ${URL:-not deployed}" >> "$GITHUB_STEP_SUMMARY"
