name: Deploy

# Builds the site and deploys it to Cloudflare Pages (project `te-tengo`, docs/DEPLOY.md):
#   - push to main      → production deployment;
#   - push to develop   → preview deployment on the `develop` branch alias;
#   - pull requests     → preview deployment on the PR branch alias.
# The Flutter PWA at /app/ is not built here: publicar.yml publishes it to R2 as
# `te-tengo-web.tar.gz`, and every deployment unpacks the latest copy into dist/app/, because a
# Pages deployment replaces the whole site.
# Without the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets the job only builds, prints a
# notice with the setup steps and succeeds.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PAGES_PROJECT: te-tengo
  WRANGLER_VERSION: 4.149.0

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      DESCARGAS_BASE_URL: ${{ vars.DESCARGAS_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_DESCARGAS_BASE_URL: ${{ vars.DESCARGAS_BASE_URL }}
        run: pnpm build

      - name: Add the published PWA under /app/
        run: |
          set -euo pipefail
          if [ -z "$DESCARGAS_BASE_URL" ]; then
            echo "::notice title=No PWA in this deployment::The DESCARGAS_BASE_URL variable is not set, so /app/ is not included. See docs/DEPLOY.md."
            exit 0
          fi
          if curl -fsSL --retry 3 -o "$RUNNER_TEMP/web.tar.gz" "${DESCARGAS_BASE_URL%/}/te-tengo-web.tar.gz"; then
            mkdir -p dist/app
            tar -xzf "$RUNNER_TEMP/web.tar.gz" -C dist/app
            echo "PWA added: $(find dist/app -type f | wc -l) files."
          else
            echo "::notice title=No PWA in this deployment::te-tengo-web.tar.gz is not in R2 yet. Run the Publicar workflow once to publish it."
          fi

      - name: Explain the missing Cloudflare secrets
        if: env.HAS_CLOUDFLARE != 'true'
        run: |
          echo "::notice title=Not deployed: Cloudflare secrets missing::Add CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit, Workers R2 Storage: Edit) and CLOUDFLARE_ACCOUNT_ID under Settings → Secrets and variables → Actions. Steps in docs/DEPLOY.md. The site was built but not deployed."
          {
            echo "### Not deployed"
            echo "The Cloudflare secrets are missing. The build passed; follow docs/DEPLOY.md to enable deployments."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Branch name
        id: branch
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Only characters Pages accepts in a branch alias; anything else becomes "-".
          branch=$(printf '%s' "${HEAD_REF:-$REF_NAME}" | tr -c 'A-Za-z0-9._/-' '-')
          echo "name=${branch}" >> "$GITHUB_OUTPUT"

      - name: Create the Pages project if it does not exist
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx --yes "wrangler@$WRANGLER_VERSION" pages project list 2> /dev/null | grep -q " $PAGES_PROJECT "; then
            npx --yes "wrangler@$WRANGLER_VERSION" pages project create "$PAGES_PROJECT" --production-branch main
          fi

      - name: Deploy to Cloudflare Pages
        id: pages
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ steps.branch.outputs.name }}
        # Wrangler through npx, outside the project's pnpm install: cloudflare/wrangler-action adds
        # wrangler with pnpm, whose build-script policy blocks esbuild/workerd (ERR_PNPM_IGNORED_BUILDS).
        run: |
          set -o pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" pages deploy dist --project-name="$PAGES_PROJECT" \
            --branch="$BRANCH" --commit-hash="$GITHUB_SHA" | tee "$RUNNER_TEMP/pages-deploy.log"
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' "$RUNNER_TEMP/pages-deploy.log" | head -n1)
          alias=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' "$RUNNER_TEMP/pages-deploy.log" | tail -n1)
          echo "deployment-url=${url}" >> "$GITHUB_OUTPUT"
          echo "pages-deployment-alias-url=${alias}" >> "$GITHUB_OUTPUT"
          if [ "$BRANCH" = main ]; then echo "pages-environment=production" >> "$GITHUB_OUTPUT"; else echo "pages-environment=preview" >> "$GITHUB_OUTPUT"; fi

      - name: Summary
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          URL: ${{ steps.pages.outputs.deployment-url }}
          ALIAS: ${{ steps.pages.outputs.pages-deployment-alias-url }}
          ENVIRONMENT: ${{ steps.pages.outputs.pages-environment }}
        run: |
          {
            echo "### Cloudflare Pages ($ENVIRONMENT)"
            echo "- Deployment: $URL"
            [ -n "$ALIAS" ] && echo "- Branch alias: $ALIAS"
          } >> "$GITHUB_STEP_SUMMARY"
