name: Release

# Release candidates of the landing (Gitflow "model C + tag at the end", docs/DEPLOY.md). A push to
# release/x.y.z or hotfix/x.y.z:
#
#   version      the branch names the version, package.json carries it, vX.Y.Z must not exist yet.
#   ci           calls ci.yml on this commit (lint, types, build, Lighthouse): the commit is tested once,
#                here, and the pull request into main does not test it again.
#   candidate    packs the dist/ that ci built and Lighthouse checked (no second build) and stores it
#                durably as the pre-release vX.Y.Z-rc.N: te-tengo-landing-X.Y.Z.tar.gz, its SBOM
#                (te-tengo-landing-X.Y.Z.spdx.json) and SHA256SUMS, with build provenance and SBOM
#                attestations; the notes hold the candidate record (commit, git tree, hashes, build and
#                `staging: pending`, or `skipped` when ENABLE_STAGING is off).
#   staging      [approval on `staging`] downloads that bundle, verifies it, deploys it to the alias
#                `staging` (https://staging.te-tengo-landing.pages.dev), smoke-checks it and records
#                `staging: passed` in the candidate.
#   pull-request opens (or updates) the pull request release/x.y.z → main, `release: x.y.z`, as the GitHub
#                App te-tengo-release-bot, so its checks run (ci-ok, release-gate, pr-title); editing
#                it re-runs release-gate, which turns green now that the candidate passed staging.
#
# Production is NOT here: merging that pull request runs produccion.yml on main, which deploys the same
# bundle (found by the tree of main, staging passed) and only then tags vX.Y.Z. A new push to the release
# branch builds rc.N+1; older candidates are kept, never changed (except their staging line).
#
# Switch (organization Actions variable; a repository variable with the same name wins). Only `true`
# turns it on; unset means off, the job shows as skipped and the run summary says why:
#   ENABLE_STAGING   the staging job. Off: the candidate is recorded `staging: skipped` and the pull
#                    request to main opens right after it.
# Secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID of the `staging` environment (only the staging
# job reads them); RELEASE_APP_PRIVATE_KEY + variable RELEASE_APP_ID (organization) for the pull request.
on:
  push:
    branches: ["release/**", "hotfix/**"]

permissions: {}

env:
  PAGES_PROJECT: te-tengo-landing
  WRANGLER_VERSION: 4.149.0
  PRODUCTION_URL: https://tetengo.reqsai.tech

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            package.json
            CHANGELOG.md
          sparse-checkout-cone-mode: false
      # The branch names the version and package.json carries it; both must agree, and the version
      # must not be released yet (a fix to a released version is a hotfix with a new version).
      - name: Check the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid version::package.json version '${version}' is not X.Y.Z."
            exit 1
          fi
          if [ "${GITHUB_REF_NAME#*/}" != "$version" ]; then
            echo "::error title=Version mismatch::Branch ${GITHUB_REF_NAME} but package.json says ${version}. Set \"version\": \"${GITHUB_REF_NAME#*/}\" in package.json (and its CHANGELOG section) on this branch."
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}" > /dev/null 2>&1; then
            echo "::error title=Already released::v${version} already exists. A change to a released version needs a new version (hotfix/x.y.z+1)."
            exit 1
          fi
          if ! grep -qF "## [${version}]" CHANGELOG.md; then
            echo "::warning title=No CHANGELOG section::CHANGELOG.md has no '## [${version}]' section; the final release notes will only link to the file. Add it on this branch."
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  candidate:
    name: Build the candidate
    needs: [version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # creates the pre-release vX.Y.Z-rc.N and its tag
      id-token: write # signs the attestations (Sigstore)
      attestations: write # stores them
    # One candidate at a time, so two quick pushes never pick the same rc number.
    concurrency:
      group: release-candidate
      cancel-in-progress: false
    outputs:
      version: ${{ needs.version.outputs.version }}
      commit-message: ${{ steps.pack.outputs.commit-message }}
      tree: ${{ steps.pack.outputs.tree }}
      build: ${{ steps.pack.outputs.build }}
      archive: ${{ steps.pack.outputs.archive }}
      archive-sha256: ${{ steps.pack.outputs.archive-sha256 }}
      dist-sha256: ${{ steps.pack.outputs.dist-sha256 }}
      staging: ${{ steps.pack.outputs.staging }}
      tag: ${{ steps.publish.outputs.tag }}
      candidate: ${{ steps.publish.outputs.candidate }}
      release-url: ${{ steps.publish.outputs.url }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            package.json
            pnpm-lock.yaml
          sparse-checkout-cone-mode: false

      # The dist/ that ci built and Lighthouse checked, in this same run: the candidate is the tested build.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # dist/version.json names the final version and the build, never "rc": the same bytes go to
      # staging and production (https://tetengo.reqsai.tech/version.json tells what is live).
      - name: Pack the bundle
        id: pack
        env:
          ENABLE_STAGING: ${{ vars.ENABLE_STAGING }}
        run: |
          set -euo pipefail
          build="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          jq -n --arg version "$VERSION" --arg build "$build" --arg commit "$GITHUB_SHA" \
            '{version: $version, build: $build, commit: $commit}' > dist/version.json
          # One hash over every file of dist/ (path and content), recomputed after every download.
          fingerprint=$(cd dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          archive="te-tengo-landing-${VERSION}.tar.gz"
          mkdir -p "$RUNNER_TEMP/bundle"
          tar -C dist -czf "$RUNNER_TEMP/bundle/${archive}" .
          if [ "$ENABLE_STAGING" = true ]; then staging=pending; else staging=skipped; fi
          {
            echo "archive=${archive}"
            echo "archive-sha256=$(sha256sum "$RUNNER_TEMP/bundle/${archive}" | cut -d' ' -f1)"
            echo "dist-sha256=${fingerprint}"
            echo "build=${build}"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "commit-message=$(git log -1 --format=%s HEAD)"
            echo "staging=${staging}"
          } >> "$GITHUB_OUTPUT"

      # The dependencies bundled into the site, from pnpm-lock.yaml.
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/bundle/te-tengo-landing-${{ needs.version.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums
        run: cd "$RUNNER_TEMP/bundle" && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS" && mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS && cat SHA256SUMS

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/bundle/te-tengo-landing-*.tar.gz
      - name: SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/bundle/te-tengo-landing-*.tar.gz
          sbom-path: ${{ runner.temp }}/bundle/te-tengo-landing-${{ needs.version.outputs.version }}.spdx.json

      # Actions artifacts expire; a pre-release does not. The block under "Candidate record" is read
      # by find-candidate.sh (produccion.yml, release-gate.yml) and rollback.yml: do not edit it by hand.
      - name: Store the candidate as a pre-release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ steps.pack.outputs.tree }}
          BUILD: ${{ steps.pack.outputs.build }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
          ARCHIVE_SHA256: ${{ steps.pack.outputs.archive-sha256 }}
          DIST_SHA256: ${{ steps.pack.outputs.dist-sha256 }}
          STAGING: ${{ steps.pack.outputs.staging }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          last=$({
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name'
            gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v${VERSION}-rc." \
              --jq '.[].ref | sub("^refs/tags/"; "")'
          } | sed -n "s/^v${VERSION//./\\.}-rc\.\([0-9][0-9]*\)$/\1/p" | sort -n | tail -n1)
          rc=$(( ${last:-0} + 1 ))
          candidate="${VERSION}-rc.${rc}"
          tag="v${candidate}"
          {
            echo "Release candidate **${candidate}** of the landing, built once from \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA:0:12}\` (build \`${VERSION}+${BUILD}\`) and tested there by CI (lint, types, Lighthouse)."
            echo
            echo "It goes to staging from the release branch and, after the pull request to \`main\` is merged, to production (\`produccion.yml\`) without rebuilding. The final release \`v${VERSION}\` is created only after production succeeds. Provenance and SBOM attestations: \`gh attestation verify ${ARCHIVE} --repo ${GITHUB_REPOSITORY}\`."
            echo
            echo "| Asset | SHA-256 |"
            echo "|---|---|"
            while read -r sha file; do echo "| \`${file}\` | \`${sha}\` |"; done < "$RUNNER_TEMP/bundle/SHA256SUMS"
            echo "| \`SHA256SUMS\` | \`$(sha256sum "$RUNNER_TEMP/bundle/SHA256SUMS" | cut -d' ' -f1)\` |"
            echo
            echo "Candidate record (read by the workflows):"
            echo
            echo '```text'
            echo "version: ${VERSION}"
            echo "candidate: ${candidate}"
            echo "build: ${BUILD}"
            echo "commit: ${GITHUB_SHA}"
            echo "tree: ${TREE}"
            echo "archive: ${ARCHIVE}"
            echo "archive-sha256: ${ARCHIVE_SHA256}"
            echo "dist-sha256: ${DIST_SHA256}"
            echo "staging: ${STAGING}"
            echo "run: ${RUN_URL}"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          url=$(gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "$candidate" --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP"/bundle/*)
          {
            echo "tag=${tag}"
            echo "candidate=${candidate}"
            echo "url=${url}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Candidate ${candidate}"
            echo "- Pre-release: ${url}"
            echo "- Commit \`${GITHUB_SHA:0:12}\`, tree \`${TREE:0:12}\`, build \`${VERSION}+${BUILD}\`"
            echo "- \`${ARCHIVE}\` SHA-256 \`${ARCHIVE_SHA256:0:16}\`, dist/ fingerprint \`${DIST_SHA256:0:16}\`"
            if [ "$STAGING" = skipped ]; then
              echo "- Staging: skipped, switched off (\`ENABLE_STAGING\` is not \`true\`); the pull request to main opens now"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$STAGING" = skipped ]; then
            echo "::notice title=Staging switched off::The Actions variable ENABLE_STAGING is not 'true': the candidate is recorded 'staging: skipped' and the pull request to main opens now."
          fi

  # The candidate goes to the alias `staging` (https://staging.te-tengo-landing.pages.dev) and is
  # checked there before anyone merges the release into main.
  staging:
    name: Staging (alias staging)
    needs: candidate
    if: vars.ENABLE_STAGING == 'true'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.alias-url }}
    concurrency:
      group: deploy-${{ github.ref }}-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # records `staging: passed` in the candidate's notes
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
      superseded: ${{ steps.deploy.outputs.superseded }}
      url: ${{ steps.deploy.outputs.alias-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/
            scripts/smoke-check.sh
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/pages-deploy
        id: deploy
        with:
          branch: staging
          head-ref: ${{ github.ref_name }}
          github-token: ${{ github.token }}
          release-tag: ${{ needs.candidate.outputs.tag }}
          archive: ${{ needs.candidate.outputs.archive }}
          archive-sha256: ${{ needs.candidate.outputs.archive-sha256 }}
          expected-sha256: ${{ needs.candidate.outputs.dist-sha256 }}
          commit-message: ${{ needs.candidate.outputs.commit-message }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          project: ${{ env.PAGES_PROJECT }}
          wrangler-version: ${{ env.WRANGLER_VERSION }}
      - name: Smoke check
        if: steps.deploy.outputs.deployed == 'true'
        env:
          URL: ${{ steps.deploy.outputs.alias-url }}
          CANONICAL: ${{ vars.SITE_URL || env.PRODUCTION_URL }}
        run: bash scripts/smoke-check.sh "$URL" "$CANONICAL" dist/index.html
      # produccion.yml and release-gate.yml accept only a candidate whose staging passed.
      - name: Record staging passed in the candidate
        if: steps.deploy.outputs.deployed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.candidate.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body | tr -d '\r' \
            | sed 's/^staging: pending$/staging: passed/' > "$RUNNER_TEMP/notes.md"
          grep -qx 'staging: passed' "$RUNNER_TEMP/notes.md" \
            || { echo "::error title=No staging line::The notes of $TAG have no 'staging: pending' line."; exit 1; }
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md" > /dev/null
          echo "- Recorded \`staging: passed\` in \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Summary
        if: always()
        env:
          CANDIDATE: ${{ needs.candidate.outputs.candidate }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.alias-url }}
        run: |
          {
            echo "### Staging (alias \`staging\`)"
            echo "- Candidate: ${CANDIDATE}"
            echo "- Alias: ${ALIAS:-not deployed}"
            echo "- Deployment: ${URL:-not deployed}"
          } >> "$GITHUB_STEP_SUMMARY"

  # After staging passed (or with staging switched off): open the pull request <release branch> → main,
  # or update it with the new candidate, as the GitHub App, so its checks run. Merging it is a human
  # action (proteger-main ruleset); the push to main then runs produccion.yml.
  pull-request:
    name: Pull request to main
    needs: [candidate, staging]
    if: >-
      !cancelled() && needs.candidate.result == 'success'
      && ((needs.staging.result == 'success' && needs.staging.outputs.deployed == 'true')
      || (needs.staging.result == 'skipped' && needs.candidate.outputs.staging == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.candidate.outputs.version }}
      CANDIDATE: ${{ needs.candidate.outputs.candidate }}
      RELEASE_URL: ${{ needs.candidate.outputs.release-url }}
      BUILD: ${{ needs.candidate.outputs.build }}
      TREE: ${{ needs.candidate.outputs.tree }}
      ARCHIVE: ${{ needs.candidate.outputs.archive }}
      ARCHIVE_SHA256: ${{ needs.candidate.outputs.archive-sha256 }}
      DIST_SHA256: ${{ needs.candidate.outputs.dist-sha256 }}
      STAGING_RESULT: ${{ needs.staging.result }}
      STAGING_URL: ${{ needs.staging.outputs.url }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Check the release bot configuration
        env:
          APP_ID: ${{ vars.RELEASE_APP_ID }}
          HAS_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$APP_ID" ] || [ "$HAS_KEY" != true ]; then
            echo "::error title=Release bot not configured::The organization variable RELEASE_APP_ID and the organization secret RELEASE_APP_PRIVATE_KEY (GitHub App te-tengo-release-bot) are required to open the pull request. Nothing falls back to GITHUB_TOKEN: its pull requests start no workflows."
            exit 1
          fi
      - name: Mint the release bot token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # The App ID; GitHub accepts it as the JWT issuer like the client ID.
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-pull-requests: write
      - name: Open or update the pull request to main
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          set -euo pipefail
          if [ "$STAGING_RESULT" = success ]; then
            staging="passed: deployed and smoke-checked at ${STAGING_URL:-https://staging.te-tengo-landing.pages.dev}"
          else
            staging="skipped: switched off (\`ENABLE_STAGING\` is not \`true\`)"
          fi
          {
            echo "Release \`${VERSION}\` of the landing from \`${GITHUB_REF_NAME}\`."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Candidate | [${CANDIDATE}](${RELEASE_URL}) (build \`${VERSION}+${BUILD}\`) |"
            echo "| Commit / tree | \`${GITHUB_SHA:0:12}\` / \`${TREE}\` |"
            echo "| Tests | CI on this commit (lint, types, build, Lighthouse), in the pipeline run below |"
            echo "| Bundle | \`${ARCHIVE}\`, SHA-256 \`${ARCHIVE_SHA256}\` |"
            echo "| dist/ fingerprint | \`${DIST_SHA256}\` |"
            echo "| Staging | ${staging} |"
            echo "| Pipeline run | ${RUN_URL} |"
            echo
            echo "\`release-gate\` checks that merging puts exactly this tree into \`main\` and that the candidate passed staging. Merge with a merge commit. Merging runs \`produccion.yml\` on \`main\`: it finds this candidate by the tree of \`main\`, deploys the same bundle to https://tetengo.reqsai.tech after the \`produccion\` approval, and only then creates \`v${VERSION}\` and the pull request \`main → develop\`. A new push to \`${GITHUB_REF_NAME}\` builds the next candidate and updates this pull request."
          } > "$RUNNER_TEMP/body.md"
          .github/scripts/open-release-pr.sh "release: ${VERSION}" "$RUNNER_TEMP/body.md" \
            "New candidate [${CANDIDATE}](${RELEASE_URL}) (commit \`${GITHUB_SHA:0:12}\`), staging ${staging%%:*}. The description now describes it."
