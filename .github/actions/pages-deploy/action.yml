name: Deploy a landing release to Cloudflare Pages
description: >-
  Downloads the dist/ bundle (tar.gz) stored as an asset of a GitHub Release (the pre-release
  vX.Y.Z-rc.N of a candidate, or the final vX.Y.Z), checks its SHA-256 and the fingerprint of the
  unpacked dist/, and deploys it to one branch of the Pages project with Wrangler. It never builds.
  Used by release.yml (staging), produccion.yml and rollback.yml (docs/DEPLOY.md).

inputs:
  branch:
    description: >-
      Pages branch to deploy to. The production branch of the project (main) publishes the
      production site; any other name is a preview deployment at https://<alias>.<project>.pages.dev.
    required: true
  release-tag:
    description: Tag of the GitHub Release that holds the bundle (vX.Y.Z-rc.N or vX.Y.Z).
    required: true
  archive:
    description: Name of the bundle asset, e.g. te-tengo-landing-0.4.0.tar.gz.
    required: true
  archive-sha256:
    description: SHA-256 of the bundle, recorded when the candidate was built.
    required: true
  expected-sha256:
    description: Fingerprint of dist/ (every path and content), recorded when the candidate was built.
    required: true
  commit-message:
    description: Commit subject attached to the Pages deployment.
    required: true
  commit-hash:
    description: Commit attached to the Pages deployment. Default the run's commit.
    required: false
    default: ""
  head-ref:
    description: >-
      Optional git branch (e.g. release/0.4.0 or main). When set, nothing is deployed if that branch
      no longer points at this run's commit: a newer push supersedes this run, also after an approval.
    required: false
    default: ""
  github-token:
    description: Token that can read the repository and its releases.
    required: true
  cloudflare-api-token:
    description: Cloudflare API token (Cloudflare Pages · Edit).
    required: true
  cloudflare-account-id:
    description: Cloudflare account ID.
    required: true
  project:
    description: Cloudflare Pages project.
    required: false
    default: te-tengo-landing
  wrangler-version:
    description: Exact Wrangler version, run through npx.
    required: false
    default: 4.149.0

outputs:
  deployed:
    description: "`true` when this action deployed the bundle."
    value: ${{ steps.pages.outputs.deployed || 'false' }}
  superseded:
    description: "`true` when head-ref points at a newer commit, so nothing was deployed."
    value: ${{ steps.head.outputs.superseded || 'false' }}
  deployment-url:
    description: Unique URL of the new deployment.
    value: ${{ steps.pages.outputs.deployment-url }}
  alias-url:
    description: Branch alias URL (empty for the production branch).
    value: ${{ steps.pages.outputs.alias-url }}

runs:
  using: composite
  steps:
    # The Cloudflare token lives in the environment of the calling job (staging or produccion), never in
    # a job without approval: without it the deploy fails here, before anything is downloaded.
    - name: Check the Cloudflare secrets
      shell: bash
      env:
        HAS_TOKEN: ${{ inputs.cloudflare-api-token != '' }}
        HAS_ACCOUNT: ${{ inputs.cloudflare-account-id != '' }}
      run: |
        if [ "$HAS_TOKEN" != true ] || [ "$HAS_ACCOUNT" != true ]; then
          echo "::error title=Cloudflare secrets missing::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be secrets of this job's environment (staging or produccion; docs/DEPLOY.md, step 5). Nothing was deployed."
          exit 1
        fi

    - name: Check that this commit is still the head of the branch
      id: head
      if: inputs.head-ref != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        HEAD_REF: ${{ inputs.head-ref }}
      run: |
        set -euo pipefail
        head=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${HEAD_REF}" --jq .object.sha)
        if [ "$head" != "$GITHUB_SHA" ]; then
          echo "superseded=true" >> "$GITHUB_OUTPUT"
          echo "::notice title=Superseded, not deployed::${HEAD_REF} now points at ${head:0:12}; this run is for ${GITHUB_SHA:0:12}. The run of the newer commit deploys instead."
          echo "- Not deployed: \`${HEAD_REF}\` moved on to \`${head:0:12}\` (superseded by a newer push)" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "superseded=false" >> "$GITHUB_OUTPUT"
        fi

    # The bundle is the one built by the candidate job of release.yml. Three checks: the SHA-256 of
    # the downloaded file against the value recorded at build time, the digest GitHub computed when
    # the asset was uploaded, and the fingerprint of every unpacked file.
    - name: Download and verify the bundle
      if: steps.head.outputs.superseded != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ inputs.release-tag }}
        ARCHIVE: ${{ inputs.archive }}
        ARCHIVE_SHA256: ${{ inputs.archive-sha256 }}
        EXPECTED: ${{ inputs.expected-sha256 }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/bundle"
        rm -rf "$dir" dist
        mkdir -p "$dir" dist
        gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARCHIVE" --dir "$dir"
        sha=$(sha256sum "$dir/$ARCHIVE" | cut -d' ' -f1)
        if [ "$sha" != "$ARCHIVE_SHA256" ]; then
          echo "::error title=Bundle changed::${ARCHIVE} of ${TAG} has SHA-256 ${sha}; the candidate recorded ${ARCHIVE_SHA256}."
          exit 1
        fi
        digest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
          --jq '.assets[] | select(.name == env.ARCHIVE) | .digest // ""')
        if [ -n "$digest" ] && [ "$digest" != "sha256:${ARCHIVE_SHA256}" ]; then
          echo "::error title=Bundle changed::GitHub reports ${digest} for ${ARCHIVE} of ${TAG}; the candidate recorded sha256:${ARCHIVE_SHA256}."
          exit 1
        fi
        tar -xzf "$dir/$ARCHIVE" -C dist --no-same-owner
        fingerprint=$(cd dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
        if [ "$fingerprint" != "$EXPECTED" ]; then
          echo "::error title=Bundle changed::dist/ fingerprint ${fingerprint}; the candidate recorded ${EXPECTED}."
          exit 1
        fi
        echo "Bundle ${ARCHIVE} of ${TAG}: SHA-256 ${sha}, fingerprint ${fingerprint}, both as recorded."
        echo "- Bundle \`${ARCHIVE}\` of \`${TAG}\`: SHA-256 \`${sha:0:16}\`, dist/ fingerprint \`${fingerprint:0:16}\` (verified)" >> "$GITHUB_STEP_SUMMARY"

    - name: Create the Pages project if it does not exist
      if: steps.head.outputs.superseded != 'true'
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        PROJECT: ${{ inputs.project }}
        WRANGLER_VERSION: ${{ inputs.wrangler-version }}
      run: |
        if ! npx --yes "wrangler@$WRANGLER_VERSION" pages project list 2> /dev/null | grep -q " $PROJECT "; then
          npx --yes "wrangler@$WRANGLER_VERSION" pages project create "$PROJECT" --production-branch main --force
        fi

    # Wrangler through npx, outside the project's pnpm install: cloudflare/wrangler-action adds wrangler
    # with pnpm, whose build-script policy blocks esbuild/workerd (ERR_PNPM_IGNORED_BUILDS). The commit
    # metadata is passed explicitly, so the dashboard lists the deployment under the right commit.
    - name: Deploy to Cloudflare Pages
      id: pages
      if: steps.head.outputs.superseded != 'true'
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        PROJECT: ${{ inputs.project }}
        WRANGLER_VERSION: ${{ inputs.wrangler-version }}
        BRANCH: ${{ inputs.branch }}
        COMMIT_HASH: ${{ inputs.commit-hash || github.sha }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
      run: |
        set -euo pipefail
        npx --yes "wrangler@$WRANGLER_VERSION" pages deploy dist --project-name="$PROJECT" \
          --branch="$BRANCH" --commit-hash="$COMMIT_HASH" --commit-message="$COMMIT_MESSAGE" \
          --commit-dirty=false | tee "$RUNNER_TEMP/pages-deploy.log"
        url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' "$RUNNER_TEMP/pages-deploy.log" | head -n1 || true)
        alias=""
        if [ "$BRANCH" != main ]; then
          # Pages names the alias after the branch: lower case, anything but [a-z0-9] becomes "-",
          # at most 28 characters. Prefer the URL Wrangler printed, if any.
          slug=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-28)
          slug=${slug%-}
          alias=$(grep -oE "https://${slug}\.${PROJECT}\.pages\.dev" "$RUNNER_TEMP/pages-deploy.log" | tail -n1 || true)
          alias=${alias:-https://${slug}.${PROJECT}.pages.dev}
        fi
        {
          echo "deployed=true"
          echo "deployment-url=${url}"
          echo "alias-url=${alias}"
        } >> "$GITHUB_OUTPUT"
