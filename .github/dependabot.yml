# Weekly dependency updates, opened against `develop`.
# Minor and patch updates arrive grouped in one pull request; major updates arrive one by one.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    ignore:
      # TypeScript 7 (native) is not supported by @astrojs/check and typescript-eslint yet.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    commit-message:
      prefix: "ci(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
