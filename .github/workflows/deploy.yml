name: Deploy

# Builds the landing ONCE per run and promotes that same build through Cloudflare Pages (project
# `te-tengo-landing`, https://tetengo.reqsai.tech, docs/DEPLOY.md). Gitflow: environments are
# promoted from the release branch; main and the tag come last, after production.
#
#   push to release/* hotfix/*   build → staging    [approval on `staging`]    → alias `staging` + smoke check
#                                      → produccion [approval on `produccion`] → production branch `main`
#                                                                                = https://tetengo.reqsai.tech + smoke check
#                                      → release-pr: opens the pull request <release branch> → main
#   push to main                 nothing here (etiquetar.yml tags the release and opens the back-merge)
#
# There is no dev stage and no pull request preview: only staging and produccion deploy, both from
# the release branch. Pushes to develop and pull requests only run CI (ci.yml). Every deploy job runs
# .github/actions/pages-deploy, which downloads the `landing-dist` artifact of the build job and
# checks its fingerprint; none of them builds, so production serves exactly the bytes that passed
# staging. The approvals are not in this file: they are the required reviewers of the `staging` and
# `produccion` environments (Settings → Environments), whose branch policies accept release/*,
# hotfix/* and main.
#
# Switches (organization Actions variables; a repository variable with the same name wins). Only the
# value `true` turns a stage on; unset means off, the job shows as skipped and the run summary says why:
#   ENABLE_STAGING             staging. Off: produccion only needs the build.
#   ENABLE_LANDING_PRODUCCION  produccion
#
# Without the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets the workflow only builds, prints a
# notice with the setup steps and succeeds, without asking for an approval.
on:
  push:
    branches: ["release/**", "hotfix/**"]

permissions:
  contents: read

# No workflow-level concurrency: a deploying job is never cancelled. Each deploy job has its own
# group per branch and stage (cancel-in-progress: false), and .github/actions/pages-deploy deploys
# nothing when the branch has moved on to a newer commit, so an approval of an older run is harmless
# and the run of the newest commit deploys.

env:
  PAGES_PROJECT: te-tengo-landing
  WRANGLER_VERSION: 4.149.0
  PRODUCTION_URL: https://tetengo.reqsai.tech

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      cloudflare: ${{ steps.config.outputs.cloudflare }}
      dist-sha256: ${{ steps.fingerprint.outputs.sha256 }}
      commit-message: ${{ steps.config.outputs.commit-message }}
      version: ${{ steps.config.outputs.version }}
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      ENABLE_STAGING: ${{ vars.ENABLE_STAGING }}
      ENABLE_PRODUCCION: ${{ vars.ENABLE_LANDING_PRODUCCION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_DESCARGAS_BASE_URL: ${{ vars.DESCARGAS_BASE_URL }}
          PUBLIC_APP_URL: ${{ vars.APP_URL }}
        run: pnpm build
      # One hash over every file of dist/ (path and content). Each deploy job recomputes it on the
      # downloaded artifact, so the run shows that every stage shipped the same build.
      - name: Fingerprint the build
        id: fingerprint
        working-directory: dist
        run: |
          set -euo pipefail
          sha=$(find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "sha256=${sha}" >> "$GITHUB_OUTPUT"
          echo "Build fingerprint: ${sha}"
      # The deploy jobs ship exactly this build, also when production is approved days later.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: landing-dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Check the Cloudflare secrets, the switches and the version
        id: config
        env:
          SHA: ${{ steps.fingerprint.outputs.sha256 }}
        run: |
          set -euo pipefail
          message=$(git log -1 --format=%s HEAD)
          version=$(node -p "require('./package.json').version")
          {
            echo "cloudflare=${HAS_CLOUDFLARE}"
            echo "commit-message=${message}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Build"
            echo "- Commit: \`${GITHUB_SHA:0:12}\`, fingerprint of dist/: \`${SHA:0:16}\`, package.json version \`${version}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          stage="release"

          # The release branch names the version; etiquetar.yml tags main with package.json's.
          if [ "$stage" = release ] && [ "${GITHUB_REF_NAME#*/}" != "$version" ]; then
            echo "::warning title=Version mismatch::Branch ${GITHUB_REF_NAME} but package.json says ${version}; the tag created on main will be v${version}. Bump package.json on this branch."
            echo "- Version mismatch: branch \`${GITHUB_REF_NAME}\`, package.json \`${version}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$HAS_CLOUDFLARE" != true ]; then
            echo "::notice title=Not deployed: Cloudflare secrets missing::Add CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit, Workers R2 Storage: Edit) and CLOUDFLARE_ACCOUNT_ID under Settings → Secrets and variables → Actions. Steps in docs/DEPLOY.md. The site was built but not deployed."
            {
              echo "### Not deployed"
              echo "The Cloudflare secrets are missing. The build passed; follow docs/DEPLOY.md to enable deployments."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          off() {
            echo "::notice title=$1 switched off::The Actions variable $2 is not 'true', so $3 is skipped."
            echo "- $1: skipped, switched off (\`$2\` is not \`true\`)" >> "$GITHUB_STEP_SUMMARY"
          }
          [ "$ENABLE_STAGING" = true ] || off "Staging" ENABLE_STAGING "the staging alias (production only needs the build)"
          [ "$ENABLE_PRODUCCION" = true ] || off "Produccion" ENABLE_LANDING_PRODUCCION "the deployment to ${PRODUCTION_URL}"

  # Release pipeline, stage 1: the build goes to the alias `staging`
  # (https://staging.te-tengo-landing.pages.dev) and is checked there before production is approved.
  staging:
    name: Staging (alias staging)
    needs: build
    if: >-
      needs.build.outputs.cloudflare == 'true' && vars.ENABLE_STAGING == 'true'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.alias-url }}
    concurrency:
      group: deploy-${{ github.ref }}-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
      superseded: ${{ steps.deploy.outputs.superseded }}
      url: ${{ steps.deploy.outputs.alias-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/
            scripts/smoke-check.sh
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/pages-deploy
        id: deploy
        with:
          branch: staging
          head-ref: ${{ github.ref_name }}
          github-token: ${{ github.token }}
          expected-sha256: ${{ needs.build.outputs.dist-sha256 }}
          commit-message: ${{ needs.build.outputs.commit-message }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          project: ${{ env.PAGES_PROJECT }}
          wrangler-version: ${{ env.WRANGLER_VERSION }}
      - name: Smoke check
        if: steps.deploy.outputs.deployed == 'true'
        env:
          URL: ${{ steps.deploy.outputs.alias-url }}
          CANONICAL: ${{ vars.SITE_URL || env.PRODUCTION_URL }}
        run: bash scripts/smoke-check.sh "$URL" "$CANONICAL" dist/index.html
      - name: Summary
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.alias-url }}
        run: |
          {
            echo "### Staging (alias \`staging\`)"
            echo "- Alias: ${ALIAS:-not deployed}"
            echo "- Deployment: ${URL:-not deployed}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Release pipeline, stage 2: the artifact that passed staging goes to the production branch (main)
  # of the Pages project. It never builds. With ENABLE_STAGING off, staging is skipped and this job
  # only needs the build.
  produccion:
    name: Produccion (tetengo.reqsai.tech)
    needs: [build, staging]
    if: >-
      !cancelled() && github.event_name != 'pull_request'
      && (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/'))
      && needs.build.result == 'success' && needs.build.outputs.cloudflare == 'true'
      && vars.ENABLE_LANDING_PRODUCCION == 'true'
      && ((needs.staging.result == 'success' && needs.staging.outputs.deployed == 'true')
        || (needs.staging.result == 'skipped' && vars.ENABLE_STAGING != 'true'))
    environment:
      name: produccion
      url: ${{ env.PRODUCTION_URL }}
    concurrency:
      group: deploy-${{ github.ref }}-produccion
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
      superseded: ${{ steps.deploy.outputs.superseded }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/
            scripts/smoke-check.sh
          sparse-checkout-cone-mode: false
      # The Pages production branch of te-tengo-landing is main: deploying the release commit there
      # publishes https://tetengo.reqsai.tech. The deployment keeps the release commit's hash and
      # message (the git branch main only receives this commit later, through the release PR).
      - uses: ./.github/actions/pages-deploy
        id: deploy
        with:
          branch: main
          head-ref: ${{ github.ref_name }}
          github-token: ${{ github.token }}
          expected-sha256: ${{ needs.build.outputs.dist-sha256 }}
          commit-message: ${{ needs.build.outputs.commit-message }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          project: ${{ env.PAGES_PROJECT }}
          wrangler-version: ${{ env.WRANGLER_VERSION }}
      - name: Smoke check
        if: steps.deploy.outputs.deployed == 'true'
        env:
          CANONICAL: ${{ vars.SITE_URL || env.PRODUCTION_URL }}
        run: bash scripts/smoke-check.sh "$PRODUCTION_URL" "$CANONICAL" dist/index.html
      - name: Summary
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          STAGING: ${{ needs.staging.outputs.url }}
        run: |
          {
            echo "### Produccion"
            echo "- Site: $PRODUCTION_URL"
            echo "- Deployment: ${URL:-not deployed}"
            echo "- Promoted from: ${STAGING:-no staging stage (ENABLE_STAGING off)}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Release pipeline, stage 3: once production is done (or its stages are switched off), open the pull
  # request <release branch> → main. Merging it is a human action (the main ruleset requires it); the
  # push to main then runs etiquetar.yml.
  release-pr:
    name: Open the release pull request
    needs: [build, staging, produccion]
    if: >-
      !cancelled() && github.event_name != 'pull_request'
      && (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/'))
      && needs.build.result == 'success'
      && (needs.staging.result == 'success' || needs.staging.result == 'skipped')
      && (needs.produccion.result == 'success' || needs.produccion.result == 'skipped')
      && needs.staging.outputs.superseded != 'true' && needs.produccion.outputs.superseded != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      FINGERPRINT: ${{ needs.build.outputs.dist-sha256 }}
      CLOUDFLARE: ${{ needs.build.outputs.cloudflare }}
      STAGING_RESULT: ${{ needs.staging.result }}
      STAGING_URL: ${{ needs.staging.outputs.url }}
      PRODUCCION_RESULT: ${{ needs.produccion.result }}
      PRODUCCION_DEPLOYMENT: ${{ needs.produccion.outputs.url }}
      ENABLE_STAGING: ${{ vars.ENABLE_STAGING }}
      ENABLE_PRODUCCION: ${{ vars.ENABLE_LANDING_PRODUCCION }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the pull request to main
        run: |
          set -euo pipefail
          release=${GITHUB_REF_NAME#*/}
          # stage <result> <switch name> <switch value> <url>
          stage() {
            if [ "$1" = success ]; then
              echo "deployed, $4"
            elif [ "$CLOUDFLARE" != true ]; then
              echo "not deployed: the Cloudflare secrets are missing"
            elif [ "$3" != true ]; then
              echo "not deployed: switched off (\`$2\` is not \`true\`)"
            else
              echo "not deployed"
            fi
          }
          {
            echo "Release \`${GITHUB_REF_NAME}\` of the landing, commit \`${GITHUB_SHA:0:12}\` (package.json \`${VERSION}\`), one build with fingerprint \`${FINGERPRINT:0:16}\`."
            echo
            echo "| Stage | Target | Result |"
            echo "|---|---|---|"
            echo "| staging | Pages alias \`staging\` | $(stage "$STAGING_RESULT" ENABLE_STAGING "$ENABLE_STAGING" "${STAGING_URL:-https://staging.te-tengo-landing.pages.dev}") |"
            echo "| produccion | Pages production branch \`main\` | $(stage "$PRODUCCION_RESULT" ENABLE_LANDING_PRODUCCION "$ENABLE_PRODUCCION" "https://tetengo.reqsai.tech (${PRODUCCION_DEPLOYMENT:-deployment URL not reported})") |"
            echo
            echo "Pipeline run: ${RUN_URL}"
            echo
            echo "Merging this pull request deploys nothing: the push to \`main\` runs \`etiquetar.yml\`, which creates the tag \`v${VERSION}\` with its GitHub Release and opens the back-merge pull request \`main → develop\`."
          } > "$RUNNER_TEMP/body.md"

          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --base main --state open --json url --jq '.[0].url // ""')
          if [ -n "$existing" ]; then
            gh pr comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
            echo "- Release pull request already open, updated with this run: $existing" >> "$GITHUB_STEP_SUMMARY"
          else
            url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$GITHUB_REF_NAME" \
              --title "release: ${release}" --body-file "$RUNNER_TEMP/body.md")
            echo "- Release pull request opened: $url" >> "$GITHUB_STEP_SUMMARY"
          fi
