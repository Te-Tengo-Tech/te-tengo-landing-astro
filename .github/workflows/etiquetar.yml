name: Etiquetar

# Runs when a release reaches main (the merged `release: x.y.z` pull request that deploy.yml opened
# after production, docs/DEPLOY.md). It deploys nothing; it only records the release:
#   1. creates the tag vX.Y.Z (X.Y.Z = "version" of package.json) on the pushed commit, with a GitHub
#      Release whose notes are the "## [X.Y.Z]" section of CHANGELOG.md. Skipped if the tag exists.
#   2. opens the back-merge pull request main → develop ("chore: merge release x.y.z back into
#      develop") when main has commits that develop lacks and no such pull request is open.
# Uses GITHUB_TOKEN only. A tag created with it starts no other workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One run at a time; a second push to main waits instead of racing for the same tag.
concurrency:
  group: etiquetar
  cancel-in-progress: false

jobs:
  etiquetar:
    name: Tag the release and open the back-merge
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            package.json
            CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Version and release notes
        id: version
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Invalid version::package.json version '$version' is not X.Y.Z."
            exit 1
          fi
          # The CHANGELOG section of this version, without its heading, up to the next "## [".
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::warning title=No CHANGELOG section::CHANGELOG.md has no '## [${version}]' section; the release notes point to the file."
            echo "See [CHANGELOG.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/v${version}/CHANGELOG.md)." > "$RUNNER_TEMP/notes.md"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create the tag and the GitHub Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" > /dev/null 2>&1; then
            echo "::notice title=Tag exists::${tag} already exists; no tag or release created."
            echo "- Tag \`${tag}\` already exists: skipped" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          echo "- Created \`${tag}\` on \`${GITHUB_SHA:0:12}\` with its GitHub Release" >> "$GITHUB_STEP_SUMMARY"

      - name: Open the back-merge pull request main → develop
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ahead=$(gh api "repos/${GITHUB_REPOSITORY}/compare/develop...main" --jq .ahead_by)
          if [ "$ahead" = 0 ]; then
            echo "- develop already contains main: no back-merge needed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head main --base develop --state open --json url --jq '.[0].url // ""')
          if [ -n "$existing" ]; then
            echo "- Back-merge pull request already open: $existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "Brings release \`v${VERSION}\` (main at \`${GITHUB_SHA:0:12}\`) back into \`develop\`: the release branch fixes, the version bump and the CHANGELOG."
            echo
            echo "Merge with a merge commit, not a squash, so develop and main share history."
          } > "$RUNNER_TEMP/body.md"
          url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base develop --head main \
            --title "chore: merge release ${VERSION} back into develop" --body-file "$RUNNER_TEMP/body.md")
          echo "- Back-merge pull request opened: $url" >> "$GITHUB_STEP_SUMMARY"
