name: Deploy the landing build to Cloudflare Pages
description: >-
  Downloads the `landing-dist` artifact of this run into `dist/`, checks its fingerprint against the
  build job and deploys it to one branch of the Pages project with Wrangler. It never builds. Used by
  every deploy job of deploy.yml (docs/DEPLOY.md).

inputs:
  branch:
    description: >-
      Pages branch to deploy to. The production branch of the project (main) publishes the
      production site; any other name is a preview deployment at https://<alias>.<project>.pages.dev.
    required: true
  expected-sha256:
    description: Fingerprint of dist/ computed by the build job.
    required: true
  commit-message:
    description: Subject of the commit this run builds, attached to the Pages deployment.
    required: true
  head-ref:
    description: >-
      Optional git branch (e.g. release/0.3.0). When set, nothing is deployed if that branch no longer
      points at this run's commit: a newer push supersedes this run, also after an approval.
    required: false
    default: ""
  github-token:
    description: Token that can read the repository (for the head-ref check).
    required: false
    default: ""
  cloudflare-api-token:
    description: Cloudflare API token (Cloudflare Pages · Edit).
    required: true
  cloudflare-account-id:
    description: Cloudflare account ID.
    required: true
  project:
    description: Cloudflare Pages project.
    required: false
    default: te-tengo-landing
  wrangler-version:
    description: Exact Wrangler version, run through npx.
    required: false
    default: 4.149.0

outputs:
  deployed:
    description: "`true` when this action deployed the build."
    value: ${{ steps.pages.outputs.deployed || 'false' }}
  superseded:
    description: "`true` when head-ref points at a newer commit, so nothing was deployed."
    value: ${{ steps.head.outputs.superseded || 'false' }}
  deployment-url:
    description: Unique URL of the new deployment.
    value: ${{ steps.pages.outputs.deployment-url }}
  alias-url:
    description: Branch alias URL (empty for the production branch).
    value: ${{ steps.pages.outputs.alias-url }}

runs:
  using: composite
  steps:
    - name: Check that this commit is still the head of the branch
      id: head
      if: inputs.head-ref != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        HEAD_REF: ${{ inputs.head-ref }}
      run: |
        set -euo pipefail
        head=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${HEAD_REF}" --jq .object.sha)
        if [ "$head" != "$GITHUB_SHA" ]; then
          echo "superseded=true" >> "$GITHUB_OUTPUT"
          echo "::notice title=Superseded, not deployed::${HEAD_REF} now points at ${head:0:12}; this run built ${GITHUB_SHA:0:12}. The run of the newer commit deploys instead."
          echo "- Not deployed: \`${HEAD_REF}\` moved on to \`${head:0:12}\` (superseded by a newer push)" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "superseded=false" >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: steps.head.outputs.superseded != 'true'
      with:
        name: landing-dist
        path: dist

    - name: Check that the artifact is the build of this run
      if: steps.head.outputs.superseded != 'true'
      shell: bash
      working-directory: dist
      env:
        EXPECTED: ${{ inputs.expected-sha256 }}
      run: |
        set -euo pipefail
        sha=$(find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
        if [ "$sha" != "$EXPECTED" ]; then
          echo "::error title=Artifact changed::dist/ fingerprint $sha, the build job produced $EXPECTED."
          exit 1
        fi
        echo "Fingerprint $sha matches the build job."

    - name: Create the Pages project if it does not exist
      if: steps.head.outputs.superseded != 'true'
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        PROJECT: ${{ inputs.project }}
        WRANGLER_VERSION: ${{ inputs.wrangler-version }}
      run: |
        if ! npx --yes "wrangler@$WRANGLER_VERSION" pages project list 2> /dev/null | grep -q " $PROJECT "; then
          npx --yes "wrangler@$WRANGLER_VERSION" pages project create "$PROJECT" --production-branch main --force
        fi

    # Wrangler through npx, outside the project's pnpm install: cloudflare/wrangler-action adds wrangler
    # with pnpm, whose build-script policy blocks esbuild/workerd (ERR_PNPM_IGNORED_BUILDS). The commit
    # metadata is passed explicitly, so a release commit deployed to the production branch (main) is
    # listed under its own hash and message, not under whatever git reports in the runner.
    - name: Deploy to Cloudflare Pages
      id: pages
      if: steps.head.outputs.superseded != 'true'
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        PROJECT: ${{ inputs.project }}
        WRANGLER_VERSION: ${{ inputs.wrangler-version }}
        BRANCH: ${{ inputs.branch }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
      run: |
        set -euo pipefail
        npx --yes "wrangler@$WRANGLER_VERSION" pages deploy dist --project-name="$PROJECT" \
          --branch="$BRANCH" --commit-hash="$GITHUB_SHA" --commit-message="$COMMIT_MESSAGE" \
          --commit-dirty=false | tee "$RUNNER_TEMP/pages-deploy.log"
        url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' "$RUNNER_TEMP/pages-deploy.log" | head -n1 || true)
        alias=""
        if [ "$BRANCH" != main ]; then
          # Pages names the alias after the branch: lower case, anything but [a-z0-9] becomes "-",
          # at most 28 characters. Prefer the URL Wrangler printed, if any.
          slug=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-28)
          slug=${slug%-}
          alias=$(grep -oE "https://${slug}\.${PROJECT}\.pages\.dev" "$RUNNER_TEMP/pages-deploy.log" | tail -n1 || true)
          alias=${alias:-https://${slug}.${PROJECT}.pages.dev}
        fi
        {
          echo "deployed=true"
          echo "deployment-url=${url}"
          echo "alias-url=${alias}"
        } >> "$GITHUB_OUTPUT"
