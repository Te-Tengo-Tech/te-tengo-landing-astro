name: Deploy

# Builds the landing and deploys it to Cloudflare Pages (project `te-tengo-landing`,
# https://tetengo.reqsai.tech, docs/DEPLOY.md):
#   - push to main      → production deployment, in the `produccion` environment: the job waits until
#                         one of its required reviewers approves it on the run page;
#   - pull requests     → preview deployment on the PR branch alias, without approval.
# A manual run deploys a preview from any branch, and production (with approval) from main.
# The Flutter PWA is not part of this site: publicar.yml deploys it to its own Pages project
# (`te-tengo-app`, https://app.tetengo.reqsai.tech), and old /app/* links redirect there
# (public/_redirects).
# Without the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets the workflow only builds, prints a
# notice with the setup steps and succeeds, without asking for an approval.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# A newer push to main cancels a run that is still waiting for approval: only the latest commit is
# offered for production.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PAGES_PROJECT: te-tengo-landing
  WRANGLER_VERSION: 4.149.0

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      cloudflare: ${{ steps.config.outputs.cloudflare }}
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_DESCARGAS_BASE_URL: ${{ vars.DESCARGAS_BASE_URL }}
          PUBLIC_APP_URL: ${{ vars.APP_URL }}
        run: pnpm build
      # The deploy jobs ship exactly this build, also when production is approved hours later.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: landing-dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 30 }}

      - name: Check the Cloudflare secrets
        id: config
        run: |
          echo "cloudflare=${HAS_CLOUDFLARE}" >> "$GITHUB_OUTPUT"
          if [ "$HAS_CLOUDFLARE" != true ]; then
            echo "::notice title=Not deployed: Cloudflare secrets missing::Add CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit, Workers R2 Storage: Edit) and CLOUDFLARE_ACCOUNT_ID under Settings → Secrets and variables → Actions. Steps in docs/DEPLOY.md. The site was built but not deployed."
            {
              echo "### Not deployed"
              echo "The Cloudflare secrets are missing. The build passed; follow docs/DEPLOY.md to enable deployments."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  preview:
    name: Cloudflare Pages (preview)
    needs: build
    # Pull requests (their ref is refs/pull/<n>/merge) and manual runs from a branch other than main.
    if: github.ref != 'refs/heads/main' && needs.build.outputs.cloudflare == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: landing-dist
          path: dist
      - name: Branch name
        id: branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Only characters Pages accepts in a branch alias; anything else becomes "-".
          branch=$(printf '%s' "${HEAD_REF:-$REF_NAME}" | tr -c 'A-Za-z0-9._/-' '-')
          echo "name=${branch}" >> "$GITHUB_OUTPUT"
      - name: Create the Pages project if it does not exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx --yes "wrangler@$WRANGLER_VERSION" pages project list 2> /dev/null | grep -q " $PAGES_PROJECT "; then
            npx --yes "wrangler@$WRANGLER_VERSION" pages project create "$PAGES_PROJECT" --production-branch main --force
          fi
      - name: Deploy to Cloudflare Pages (preview)
        id: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ steps.branch.outputs.name }}
        # Wrangler through npx, outside the project's pnpm install: cloudflare/wrangler-action adds
        # wrangler with pnpm, whose build-script policy blocks esbuild/workerd (ERR_PNPM_IGNORED_BUILDS).
        run: |
          set -o pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" pages deploy dist --project-name="$PAGES_PROJECT" \
            --branch="$BRANCH" --commit-hash="$GITHUB_SHA" | tee "$RUNNER_TEMP/pages-deploy.log"
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' "$RUNNER_TEMP/pages-deploy.log" | head -n1)
          alias=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' "$RUNNER_TEMP/pages-deploy.log" | tail -n1)
          echo "deployment-url=${url}" >> "$GITHUB_OUTPUT"
          echo "pages-deployment-alias-url=${alias}" >> "$GITHUB_OUTPUT"
      - name: Summary
        env:
          URL: ${{ steps.pages.outputs.deployment-url }}
          ALIAS: ${{ steps.pages.outputs.pages-deployment-alias-url }}
        run: |
          {
            echo "### Cloudflare Pages (preview)"
            echo "- Deployment: $URL"
            if [ -n "$ALIAS" ]; then echo "- Branch alias: $ALIAS"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Cloudflare Pages (production)
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.cloudflare == 'true'
    # Required reviewers approve this job on the run page; the environment only accepts main.
    environment:
      name: produccion
      url: https://tetengo.reqsai.tech
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: landing-dist
          path: dist
      - name: Create the Pages project if it does not exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx --yes "wrangler@$WRANGLER_VERSION" pages project list 2> /dev/null | grep -q " $PAGES_PROJECT "; then
            npx --yes "wrangler@$WRANGLER_VERSION" pages project create "$PAGES_PROJECT" --production-branch main --force
          fi
      - name: Deploy to Cloudflare Pages (production)
        id: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" pages deploy dist --project-name="$PAGES_PROJECT" \
            --branch=main --commit-hash="$GITHUB_SHA" | tee "$RUNNER_TEMP/pages-deploy.log"
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' "$RUNNER_TEMP/pages-deploy.log" | head -n1)
          echo "deployment-url=${url}" >> "$GITHUB_OUTPUT"
      - name: Summary
        env:
          URL: ${{ steps.pages.outputs.deployment-url }}
        run: |
          {
            echo "### Cloudflare Pages (production)"
            echo "- Site: https://tetengo.reqsai.tech"
            echo "- Deployment: $URL"
          } >> "$GITHUB_STEP_SUMMARY"
