name: Bug report
description: Something on the landing page is wrong, broken or inaccessible
title: "fix: <short description>"
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong? Do not paste personal data.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - copy / content
        - layout / design
        - accessibility
        - downloads (links, platform detection)
        - SEO / metadata
        - deploy (Cloudflare Pages, R2, workflows)
        - unknown
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Page, browser and screen width
      placeholder: "/ · Safari iOS 18 · 375 px"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
