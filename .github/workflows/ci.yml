name: CI

# Install, lint, type-check, build and run Lighthouse CI on the built site (budgets: every category
# ≥ 0.95, lighthouserc.cjs). Tested once per commit (docs/DEPLOY.md):
#   - pull requests into develop (and into a release branch): the full CI;
#   - push to develop: the full CI on the merged commit (it also refreshes the caches pull requests read);
#   - release/x.y.z and hotfix/x.y.z: release.yml calls this workflow (workflow_call) on the candidate's
#     commit, and its candidate is the very dist/ built and tested here;
#   - pull requests into main (release and hotfix): nothing is rebuilt. Their head is that tested
#     candidate commit and release-gate.yml proves it; only `ci-ok` runs.
# `ci-ok` is the single required check of the rulesets: it fails unless every job it needs passed.
on:
  pull_request:
  push:
    branches: [develop]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, types and build
    if: github.event_name != 'pull_request' || github.base_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint (ESLint + Prettier)
        run: pnpm lint
      - name: Astro check
        run: pnpm check
      # The same build settings as the release candidate: release.yml packs this very dist/.
      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_DESCARGAS_BASE_URL: ${{ vars.DESCARGAS_BASE_URL }}
          PUBLIC_APP_URL: ${{ vars.APP_URL }}
        run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Lighthouse CI (mobile)
        run: pnpm lhci
      - name: Summary
        if: always()
        run: |
          {
            echo "### Lighthouse (mobile)"
            node scripts/lhci-summary.mjs
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
          retention-days: 14

  # The single required check (rulesets of develop and main). It always runs, so a skipped or cancelled
  # job can never pass for a green one.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [check, lighthouse]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every CI job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          RELEASE_PR: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          if [ "$RELEASE_PR" = true ]; then
            # Pull requests into main carry an already tested candidate; release-gate.yml checks it.
            if [[ ! "$HEAD_REF" =~ ^(release|hotfix)/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error title=Not a release branch::Only release/x.y.z and hotfix/x.y.z are merged into main; open the pull request from $HEAD_REF against develop."
              exit 1
            fi
            echo "Release pull request from $HEAD_REF: its candidate's commit was tested by release.yml; release-gate decides."
            exit 0
          fi
          failed=$(jq -r '[to_entries[] | select(.value.result != "success") | "\(.key) (\(.value.result))"] | join(", ")' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "::error title=CI failed::Not passed: $failed."
            exit 1
          fi
          echo "Every CI job passed."
