name: Produccion

# Production of the landing (Gitflow "model C + tag at the end", docs/DEPLOY.md). Runs when a release
# or hotfix pull request (opened by release.yml) is merged into main. Nothing is built or tested here:
# the candidate's commit was tested by CI when release.yml built it, and release-gate proved before the
# merge that main gets exactly its tree.
#
#   candidate    finds the approved candidate with .github/scripts/find-candidate.sh (the same command as
#                release-gate): the newest pre-release vX.Y.Z-rc.N (X.Y.Z = version of package.json)
#                whose recorded git tree equals the tree of this main commit and whose staging passed
#                (or was switched off). None → the run fails: main is not what was tested.
#   produccion   [approval on `produccion`] downloads that candidate's bundle, verifies its SHA-256
#                and fingerprint and deploys it, without rebuilding, to the Pages production branch
#                `main` = https://tetengo.reqsai.tech + smoke check.
#   release      only after produccion deployed: the final GitHub Release vX.Y.Z (tag on this main
#                commit) with the same assets (bundle, SBOM, SHA256SUMS; their attestations stay valid)
#                and the CHANGELOG section as notes.
#   back-merge   the pull request main → develop as te-tengo-release-bot, with auto-merge (merge
#                commit); after a hotfix also main → any newer open release/* branch.
#
# If produccion fails, is rejected or is switched off, there is no tag. "Re-run failed jobs" (or a
# manual run on main) deploys the same candidate again; nothing is rebuilt.
#
# Switch (organization Actions variable; a repository variable with the same name wins). Only `true`
# turns it on: ENABLE_LANDING_PRODUCCION. Off, nothing is deployed, so no tag and no back-merge are
# created (the run summary says why). Secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID of the
# `produccion` environment; RELEASE_APP_PRIVATE_KEY + variable RELEASE_APP_ID for the back-merge.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  PAGES_PROJECT: te-tengo-landing
  WRANGLER_VERSION: 4.149.0
  PRODUCTION_URL: https://tetengo.reqsai.tech

jobs:
  candidate:
    name: Find the approved candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      released: ${{ steps.version.outputs.released }}
      version: ${{ steps.version.outputs.version }}
      tree: ${{ steps.version.outputs.tree }}
      commit-message: ${{ steps.version.outputs.commit-message }}
      tag: ${{ steps.find.outputs.tag }}
      candidate: ${{ steps.find.outputs.candidate }}
      build: ${{ steps.find.outputs.build }}
      archive: ${{ steps.find.outputs.archive }}
      archive-sha256: ${{ steps.find.outputs.archive-sha256 }}
      dist-sha256: ${{ steps.find.outputs.dist-sha256 }}
      staging: ${{ steps.find.outputs.staging }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            package.json
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Version and tree of this commit
        id: version
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid version::package.json version '${version}' is not X.Y.Z."
            exit 1
          fi
          {
            echo "version=${version}"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "commit-message=$(git log -1 --format=%s HEAD)"
          } >> "$GITHUB_OUTPUT"
          # A re-run after a complete release finds the tag on this commit: nothing left to do.
          if released=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}" --jq .object.sha 2> /dev/null); then
            if [ "$released" = "$GITHUB_SHA" ]; then
              echo "::notice title=Already released::v${version} already points at this commit; nothing to deploy."
              echo "released=true" >> "$GITHUB_OUTPUT"
              echo "- \`v${version}\` already released on this commit: nothing to do" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error title=Version already released::v${version} exists on ${released:0:12}, but main at ${GITHUB_SHA:0:12} still says ${version} in package.json. Releases reach main only through release/x.y.z or hotfix/x.y.z with a new version."
            exit 1
          fi
          echo "released=false" >> "$GITHUB_OUTPUT"

      - name: Find the candidate whose tree is this commit's
        id: find
        if: steps.version.outputs.released == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TREE: ${{ steps.version.outputs.tree }}
          ENABLE_PRODUCCION: ${{ vars.ENABLE_LANDING_PRODUCCION }}
        run: |
          set -euo pipefail
          echo "### Approved candidate" >> "$GITHUB_STEP_SUMMARY"
          if ! .github/scripts/find-candidate.sh "$VERSION" "$TREE"; then
            echo "::error title=No tested candidate for this commit::main (${GITHUB_SHA:0:12}, tree ${TREE:0:12}) is not the tree of any candidate of ${VERSION} that passed staging. Push the change to the release branch to build a new rc, test it in staging and merge again."
            exit 1
          fi
          if [ "$ENABLE_PRODUCCION" != true ]; then
            echo "::notice title=Produccion switched off::ENABLE_LANDING_PRODUCCION is not 'true', so nothing is deployed and v${VERSION} is not tagged. Turn it on and run Produccion on main again."
            echo "- Produccion: skipped, switched off (\`ENABLE_LANDING_PRODUCCION\` is not \`true\`); no tag" >> "$GITHUB_STEP_SUMMARY"
          fi

  # The approved candidate's bundle goes to the production branch (main) of the Pages project.
  produccion:
    name: Produccion (tetengo.reqsai.tech)
    needs: candidate
    if: needs.candidate.outputs.released == 'false' && vars.ENABLE_LANDING_PRODUCCION == 'true'
    environment:
      name: produccion
      url: ${{ env.PRODUCTION_URL }}
    # Shared with rollback.yml: one production deployment at a time, none ever cancelled.
    concurrency:
      group: landing-produccion
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/
            scripts/smoke-check.sh
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/pages-deploy
        id: deploy
        with:
          branch: main
          head-ref: main
          github-token: ${{ github.token }}
          release-tag: ${{ needs.candidate.outputs.tag }}
          archive: ${{ needs.candidate.outputs.archive }}
          archive-sha256: ${{ needs.candidate.outputs.archive-sha256 }}
          expected-sha256: ${{ needs.candidate.outputs.dist-sha256 }}
          commit-message: ${{ needs.candidate.outputs.commit-message }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          project: ${{ env.PAGES_PROJECT }}
          wrangler-version: ${{ env.WRANGLER_VERSION }}
      # Post-deploy health check: the site answers, its canonical link is right, the served index.html
      # is the bundle's byte for byte, and version.json names the candidate's build.
      - name: Smoke check
        if: steps.deploy.outputs.deployed == 'true'
        env:
          CANONICAL: ${{ vars.SITE_URL || env.PRODUCTION_URL }}
          BUILD: ${{ needs.candidate.outputs.build }}
          VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/smoke-check.sh "$PRODUCTION_URL" "$CANONICAL" dist/index.html
          expected=$(jq -c '{version, build}' dist/version.json)
          for attempt in $(seq 1 12); do
            served=$(curl -fsS "${PRODUCTION_URL}/version.json?check=${attempt}" | jq -c '{version, build}' || true)
            [ "$served" = "$expected" ] && break
            echo "Attempt ${attempt}: version.json is ${served:-unreadable}, expected ${expected}"
            sleep 5
          done
          if [ "$served" != "$expected" ]; then
            echo "::error title=Production serves another build::${PRODUCTION_URL}/version.json is ${served:-unreadable}, expected ${expected} (candidate ${VERSION}+${BUILD})."
            exit 1
          fi
          echo "- ${PRODUCTION_URL}/version.json: \`${served}\` (the candidate)" >> "$GITHUB_STEP_SUMMARY"
      - name: Summary
        if: always()
        env:
          CANDIDATE: ${{ needs.candidate.outputs.candidate }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "### Produccion"
            echo "- Site: $PRODUCTION_URL"
            echo "- Candidate: ${CANDIDATE}"
            echo "- Deployment: ${URL:-not deployed}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Tag at the end: only a version that is live gets vX.Y.Z.
  release:
    name: Tag vX.Y.Z and GitHub Release
    needs: [candidate, produccion]
    if: >-
      !cancelled() && needs.produccion.result == 'success' && needs.produccion.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # creates the tag vX.Y.Z and its GitHub Release
    concurrency:
      group: landing-release-tag
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.candidate.outputs.version }}
      RC_TAG: ${{ needs.candidate.outputs.tag }}
      CANDIDATE: ${{ needs.candidate.outputs.candidate }}
      BUILD: ${{ needs.candidate.outputs.build }}
      TREE: ${{ needs.candidate.outputs.tree }}
      ARCHIVE: ${{ needs.candidate.outputs.archive }}
      ARCHIVE_SHA256: ${{ needs.candidate.outputs.archive-sha256 }}
      DIST_SHA256: ${{ needs.candidate.outputs.dist-sha256 }}
      STAGING: ${{ needs.candidate.outputs.staging }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      # The final release carries the candidate's own assets, verified again before attaching them.
      - name: Download the candidate's assets
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bundle"
          gh release download "$RC_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/bundle"
          cd "$RUNNER_TEMP/bundle"
          sha256sum -c SHA256SUMS
          if [ "$(sha256sum "$ARCHIVE" | cut -d' ' -f1)" != "$ARCHIVE_SHA256" ]; then
            echo "::error title=Bundle changed::${ARCHIVE} of ${RC_TAG} is not the bundle that was deployed (${ARCHIVE_SHA256})."
            exit 1
          fi

      - name: Create the tag and the GitHub Release
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          # The CHANGELOG section of this version, without its heading, up to the next "## [".
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::warning title=No CHANGELOG section::CHANGELOG.md has no '## [${VERSION}]' section; the release notes point to the file."
            echo "See [CHANGELOG.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${tag}/CHANGELOG.md)." > "$RUNNER_TEMP/notes.md"
          fi
          {
            echo
            echo "---"
            echo
            echo "Deployed to ${PRODUCTION_URL} from candidate [${CANDIDATE}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RC_TAG}) without rebuilding (build \`${VERSION}+${BUILD}\`). \`rollback.yml\` can put this version back in production. Provenance and SBOM attestations: \`gh attestation verify ${ARCHIVE} --repo ${GITHUB_REPOSITORY}\`."
            echo
            echo "| Asset | SHA-256 |"
            echo "|---|---|"
            while read -r sha file; do echo "| \`${file}\` | \`${sha}\` |"; done < "$RUNNER_TEMP/bundle/SHA256SUMS"
            echo
            echo "Candidate record (read by the workflows):"
            echo
            echo '```text'
            echo "version: ${VERSION}"
            echo "candidate: ${CANDIDATE}"
            echo "build: ${BUILD}"
            echo "commit: ${GITHUB_SHA}"
            echo "tree: ${TREE}"
            echo "archive: ${ARCHIVE}"
            echo "archive-sha256: ${ARCHIVE_SHA256}"
            echo "dist-sha256: ${DIST_SHA256}"
            echo "staging: ${STAGING}"
            echo "run: ${RUN_URL}"
            echo '```'
          } >> "$RUNNER_TEMP/notes.md"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A re-run after a partial upload: attach only what is missing.
            have=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            for file in "$RUNNER_TEMP"/bundle/*; do
              if ! grep -qxF "$(basename "$file")" <<< "$have"; then
                gh release upload "$tag" "$file" --repo "$GITHUB_REPOSITORY"
              fi
            done
            echo "- \`${tag}\` already existed: assets completed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP"/bundle/*
          echo "- Created \`${tag}\` on \`${GITHUB_SHA:0:12}\` with the assets of \`${RC_TAG}\`" >> "$GITHUB_STEP_SUMMARY"

  back-merge:
    name: Back-merge into develop
    needs: [candidate, release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Check the release bot configuration
        env:
          APP_ID: ${{ vars.RELEASE_APP_ID }}
          HAS_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$APP_ID" ] || [ "$HAS_KEY" != true ]; then
            echo "::error title=Release bot not configured::The organization variable RELEASE_APP_ID and the organization secret RELEASE_APP_PRIVATE_KEY (GitHub App te-tengo-release-bot) are required to open the back-merge pull request. Nothing falls back to GITHUB_TOKEN: its pull requests start no workflows."
            exit 1
          fi
      - name: Mint the release bot token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # The App ID; GitHub accepts it as the JWT issuer like the client ID.
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write # auto-merge
          permission-pull-requests: write
      - name: Open the back-merge pull requests
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          VERSION: ${{ needs.candidate.outputs.version }}
        run: .github/scripts/back-merge.sh "$VERSION"
